<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SABAI GO - Party Girl Detail</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px 6%;

      background: rgba(0,0,0,.93);
      border-bottom: 1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
    }

    .logo span {
      color: #ff2ea6;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: #ccc;
      font-size: 14px;
    }

    .lang-btn {
      border: 1px solid #ff2ea6;
      background: transparent;
      color: white;

      padding: 7px 13px;
      border-radius: 20px;
    }

    .lang-btn.active {
      background: #ff2ea6;
    }

    /* =========================
       LAYOUT
    ========================= */

    .container {
      max-width: 1150px;
      margin: auto;

      padding: 45px 20px 80px;

      display: grid;
      grid-template-columns: 420px 1fr;

      gap: 45px;
    }

    .photo-card {
      position: sticky;
      top: 95px;

      height: fit-content;
    }

    .main-photo-wrap {
      position: relative;
    }

    .main-photo {
      width: 100%;
      aspect-ratio: 3 / 4;

      object-fit: cover;

      border-radius: 22px;

      background: #111;

      border: 1px solid rgba(255,255,255,.08);

      cursor: pointer;
    }

    .photo-placeholder {
      width: 100%;
      aspect-ratio: 3 / 4;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #26102c,
          #111
        );

      color: #666;
    }

    /* =========================
       THUMBNAILS
    ========================= */

    .thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

      gap: 8px;

      margin-top: 10px;
    }

    .thumb-item {
      aspect-ratio: 3 / 4;

      overflow: hidden;

      border-radius: 9px;

      border: 1px solid #292929;

      background: #151515;

      cursor: pointer;

      opacity: .82;

      transition: .2s;
    }

    .thumb-item:hover {
      opacity: 1;
      border-color: #ff2ea6;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .status-row {
      margin-top: 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .status {
      padding: 8px 13px;

      border-radius: 20px;

      font-size: 13px;
      font-weight: bold;
    }

    .available {
      background: rgba(24,180,100,.9);
    }

    .busy {
      background: rgba(235,150,20,.92);
    }

    .off {
      background: rgba(90,90,90,.9);
    }

    .profile-code {
      color: #777;

      font-size: 12px;
    }

    /* =========================
       INFO
    ========================= */

    .name {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .sub-info {
      color: #aaa;

      font-size: 15px;

      margin-bottom: 25px;

      line-height: 1.7;
    }

    .price-box {
      background:
        linear-gradient(
          135deg,
          rgba(139,60,255,.18),
          rgba(255,46,166,.15)
        );

      border: 1px solid rgba(255,46,166,.25);

      border-radius: 18px;

      padding: 24px;

      margin-bottom: 18px;
    }

    .label {
      color: #777;

      font-size: 11px;

      margin-bottom: 6px;
    }

    .price {
      font-size: 34px;
      font-weight: bold;

      color: #ff54b8;

      margin-bottom: 7px;
    }

    .price-note {
      color: #aaa;

      font-size: 13px;
    }

    .section {
      background: #0e0e0e;

      border: 1px solid rgba(255,255,255,.07);

      border-radius: 18px;

      padding: 23px;

      margin-bottom: 18px;
    }

    .section h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .info-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 14px;
    }

    .info-box {
      background: #151515;

      border-radius: 12px;

      padding: 14px;
    }

    .value {
      font-size: 15px;
      line-height: 1.6;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;
    }

    .tag {
      background: #191919;

      border: 1px solid #292929;

      padding: 8px 11px;

      border-radius: 18px;

      color: #ccc;

      font-size: 13px;
    }

    .description {
      color: #bbb;

      line-height: 1.8;

      font-size: 15px;

      white-space: pre-line;
    }

    /* =========================
       GALLERY
    ========================= */

    .gallery-grid {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 10px;
    }

    .gallery-item {
      aspect-ratio: 3 / 4;

      overflow: hidden;

      border-radius: 12px;

      background: #151515;

      cursor: pointer;

      border: 1px solid #292929;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition: .2s;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
    }

    /* =========================
       WHATSAPP
    ========================= */

    .whatsapp-btn {
      display: block;

      width: 100%;

      border: none;

      padding: 16px;

      border-radius: 12px;

      background:
        linear-gradient(
          90deg,
          #25D366,
          #17aa50
        );

      color: white;

      text-align: center;

      font-size: 17px;
      font-weight: bold;

      margin-top: 15px;

      transition: .2s;
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px);

      opacity: .94;
    }

    .contact-note {
      margin-top: 13px;

      color: #777;

      font-size: 11px;

      line-height: 1.6;

      text-align: center;
    }

    /* =========================
       LIGHTBOX
    ========================= */

    .lightbox {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 5000;

      background: rgba(0,0,0,.94);

      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .lightbox.show {
      display: flex;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 92vh;

      object-fit: contain;

      border-radius: 12px;
    }

    .lightbox-close {
      position: absolute;

      top: 18px;
      right: 24px;

      width: 42px;
      height: 42px;

      border: none;

      border-radius: 50%;

      background: rgba(255,255,255,.12);

      color: white;

      font-size: 25px;
    }

    /* =========================
       OTHER
    ========================= */

    .loading,
    .not-found {
      padding: 100px 20px;

      text-align: center;

      color: #888;
    }

    .not-found {
      display: none;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,.07);

      color: #666;

      text-align: center;

      padding: 25px;

      font-size: 12px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:850px) {

      .container {
        grid-template-columns: 1fr;

        max-width: 650px;
      }

      .photo-card {
        position: static;
      }

      .main-photo {
        max-height: 650px;
      }

    }

    @media(max-width:520px) {

      .topbar {
        padding: 13px 15px;
      }

      .logo {
        font-size: 23px;
      }

      .back-btn {
        display: none;
      }

      .container {
        padding: 22px 14px 60px;

        gap: 25px;
      }

      .name {
        font-size: 32px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .thumbs {
        grid-template-columns: repeat(4, 1fr);
      }

    }
  </style>
</head>

<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://xfezhdqakmyecregqesn.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_AuNzm5CWOK2B2Pa7Pn_wBA_pAqHVpI2";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     WHATSAPP
  ========================================= */

  const WHATSAPP_NUMBER =
    "601163803627";


  let profile =
    null;


  let galleryImages =
    [];


  let currentLanguage =
    localStorage.getItem(
      "sabaigo-language"
    ) || "zh";


  const params =
    new URLSearchParams(
      window.location.search
    );


  const slug =
    params.get(
      "id"
    );


  /* =========================================
     LOAD PROFILE
  ========================================= */

  async function loadProfile() {

    if (!slug) {

      showNotFound();

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from(
          "companions"
        )
        .select("*")
        .eq(
          "slug",
          slug
        )
        .eq(
          "is_published",
          true
        )
        .maybeSingle();


    if (
      error ||
      !data
    ) {

      console.error(
        error
      );


      showNotFound();

      return;

    }


    profile =
      data;


    await loadGallery();


    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "profilePage"
      )
      .style.display =
        "block";


    renderProfile();

  }


  /* =========================================
     LOAD MULTIPLE IMAGES
  ========================================= */

  async function loadGallery() {

    if (!profile) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from(
          "companion_images"
        )
        .select("*")
        .eq(
          "companion_id",
          profile.id
        )
        .order(
          "sort_order",
          {
            ascending: true
          }
        );


    if (
      error
    ) {

      console.error(
        "Gallery error:",
        error
      );


      galleryImages =
        [];


      return;

    }


    galleryImages =
      data || [];

  }


  /* =========================================
     RENDER
  ========================================= */

  function renderProfile() {

    if (!profile) {
      return;
    }


    renderMainPhoto();

    renderThumbnails();

    renderGallery();


    document
      .getElementById(
        "name"
      )
      .textContent =
        profile.nickname ||
        "-";


    document
      .getElementById(
        "profileCode"
      )
      .textContent =
        profile.slug ||
        "";


    document
      .getElementById(
        "age"
      )
      .textContent =
        profile.age ??
        "-";


    document
      .getElementById(
        "area"
      )
      .textContent =
        profile.area ||
        "-";


    document
      .getElementById(
        "gender"
      )
      .textContent =
        genderText(
          profile.gender
        );


    document
      .getElementById(
        "serviceType"
      )
      .textContent =
        "Party Girl";


    document
      .getElementById(
        "availableTime"
      )
      .textContent =
        profile.available_time ||
        "-";


    document
      .getElementById(
        "price"
      )
      .textContent =
        "RM" +
        (
          profile.price_per_hour ??
          0
        ) +
        (
          currentLanguage === "zh"
            ? " / 小时"
            : " / ชั่วโมง"
        );


    document
      .getElementById(
        "minimum"
      )
      .textContent =
        currentLanguage === "zh"
          ? "最低 " +
            (
              profile.minimum_hours ||
              0
            ) +
            " 小时"
          : "ขั้นต่ำ " +
            (
              profile.minimum_hours ||
              0
            ) +
            " ชั่วโมง";


    document
      .getElementById(
        "subInfo"
      )
      .textContent =
        "📍 " +
        (
          profile.area ||
          "-"
        ) +
        " · Party Girl";


    document
      .getElementById(
        "description"
      )
      .textContent =
        currentLanguage === "zh"
          ? (
              profile.description_zh ||
              "-"
            )
          : (
              profile.description_th ||
              "-"
            );


    renderLanguageTags();

    renderServiceTags();

    renderStatus();


    document
      .getElementById(
        "whatsappBtn"
      )
      .textContent =
        currentLanguage === "zh"
          ? "💬 WhatsApp 联系"
          : "💬 ติดต่อผ่าน WhatsApp";

  }


  /* =========================================
     MAIN PHOTO
  ========================================= */

  function renderMainPhoto() {

    const photoBox =
      document
        .getElementById(
          "photoBox"
        );


    if (
      profile.cover_image
    ) {

      photoBox.innerHTML = `

        <img
          id="mainPhoto"
          class="main-photo"
          src="${escapeHtml(profile.cover_image)}"
          alt="${escapeHtml(profile.nickname || "")}"
          onclick="openLightbox('${escapeJs(profile.cover_image)}')">

      `;

    }
    else {

      photoBox.innerHTML = `

        <div class="photo-placeholder">
          No Image
        </div>

      `;

    }

  }


  /* =========================================
     THUMBNAILS
  ========================================= */

  function renderThumbnails() {

    const section =
      document
        .getElementById(
          "thumbnailSection"
        );


    section.innerHTML =
      "";


    const photos =
      [];


    if (
      profile.cover_image
    ) {

      photos.push(
        profile.cover_image
      );

    }


    galleryImages.forEach(
      function(image) {

        if (
          image.image_url
        ) {

          photos.push(
            image.image_url
          );

        }

      }
    );


    if (
      photos.length <= 1
    ) {

      section.style.display =
        "none";


      return;

    }


    section.style.display =
      "grid";


    photos.forEach(
      function(url) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "thumb-item";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          url;


        img.alt =
          profile.nickname ||
          "Party Girl";


        img.addEventListener(
          "click",
          function() {

            changeMainPhoto(
              url
            );

          }
        );


        div.appendChild(
          img
        );


        section.appendChild(
          div
        );

      }
    );

  }


  /* =========================================
     CHANGE MAIN PHOTO
  ========================================= */

  function changeMainPhoto(
    url
  ) {

    const mainPhoto =
      document
        .getElementById(
          "mainPhoto"
        );


    if (
      mainPhoto
    ) {

      mainPhoto.src =
        url;


      mainPhoto.onclick =
        function() {

          openLightbox(
            url
          );

        };

    }

  }


  /* =========================================
     GALLERY
  ========================================= */

  function renderGallery() {

    const section =
      document
        .getElementById(
          "gallerySection"
        );


    const grid =
      document
        .getElementById(
          "galleryGrid"
        );


    grid.innerHTML =
      "";


    if (
      galleryImages.length === 0
    ) {

      section.style.display =
        "none";


      return;

    }


    section.style.display =
      "block";


    galleryImages.forEach(
      function(image) {

        if (
          !image.image_url
        ) {

          return;

        }


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "gallery-item";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          image.image_url;


        img.alt =
          profile.nickname ||
          "Party Girl";


        div.addEventListener(
          "click",
          function() {

            openLightbox(
              image.image_url
            );

          }
        );


        div.appendChild(
          img
        );


        grid.appendChild(
          div
        );

      }
    );

  }


  /* =========================================
     LIGHTBOX
  ========================================= */

  function openLightbox(
    url
  ) {

    if (!url) {
      return;
    }


    document
      .getElementById(
        "lightboxImage"
      )
      .src =
        url;


    document
      .getElementById(
        "lightbox"
      )
      .classList
      .add(
        "show"
      );


    document.body.style.overflow =
      "hidden";

  }


  function closeLightbox() {

    document
      .getElementById(
        "lightbox"
      )
      .classList
      .remove(
        "show"
      );


    document.body.style.overflow =
      "";

  }


  /* =========================================
     WHATSAPP
  ========================================= */

  function contactWhatsApp() {

    if (!profile) {
      return;
    }


    const nickname =
      profile.nickname ||
      "-";


    const code =
      profile.slug ||
      "-";


    const area =
      profile.area ||
      "-";


    const price =
      profile.price_per_hour ??
      0;


    const minimum =
      profile.minimum_hours ||
      0;


    let message;


    if (
      currentLanguage === "zh"
    ) {

      message =
`你好 SABAI GO，我想咨询这个 Party Girl 资料。

昵称：${nickname}
编号：${code}
地区：${area}
价格：RM${price} / 小时
最低：${minimum} 小时

请问现在可以安排吗？`;

    }
    else {

      message =
`สวัสดี SABAI GO ฉันต้องการสอบถาม Party Girl โปรไฟล์นี้

ชื่อ: ${nickname}
รหัส: ${code}
พื้นที่: ${area}
ราคา: RM${price} / ชั่วโมง
ขั้นต่ำ: ${minimum} ชั่วโมง

ตอนนี้สามารถนัดได้ไหม?`;

    }


    const url =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(
        message
      );


    window.location.href =
      url;

  }


  /* =========================================
     LANGUAGES
  ========================================= */

  function renderLanguageTags() {

    const box =
      document
        .getElementById(
          "languages"
        );


    box.innerHTML =
      "";


    if (
      !profile.languages
    ) {

      box.innerHTML =
        `<span class="tag">-</span>`;


      return;

    }


    splitValues(
      profile.languages
    )
      .forEach(
        function(item) {

          const span =
            document.createElement(
              "span"
            );


          span.className =
            "tag";


          span.textContent =
            languageText(
              item
            );


          box.appendChild(
            span
          );

        }
      );

  }


  /* =========================================
     SERVICES
  ========================================= */

  function renderServiceTags() {

    const box =
      document
        .getElementById(
          "services"
        );


    box.innerHTML =
      "";


    const value =
      currentLanguage === "zh"
        ? profile.services_zh
        : profile.services_th;


    if (
      !value
    ) {

      box.innerHTML =
        `<span class="tag">-</span>`;


      return;

    }


    splitValues(
      value
    )
      .forEach(
        function(item) {

          const span =
            document.createElement(
              "span"
            );


          span.className =
            "tag";


          span.textContent =
            item;


          box.appendChild(
            span
          );

        }
      );

  }


  /* =========================================
     STATUS
  ========================================= */

  function renderStatus() {

    const status =
      document
        .getElementById(
          "status"
        );


    status.className =
      "status " +
      statusClass(
        profile.status
      );


    status.textContent =
      statusText(
        profile.status
      );

  }


  function statusClass(
    value
  ) {

    if (
      value === "available"
    ) {

      return "available";

    }


    if (
      value === "busy"
    ) {

      return "busy";

    }


    return "off";

  }


  function statusText(
    value
  ) {

    if (
      value === "available"
    ) {

      return currentLanguage === "zh"
        ? "● Available"
        : "● ว่าง";

    }


    if (
      value === "busy"
    ) {

      return currentLanguage === "zh"
        ? "● Busy"
        : "● ไม่ว่าง";

    }


    return currentLanguage === "zh"
      ? "● Off"
      : "● ปิด";

  }


  /* =========================================
     GENDER
  ========================================= */

  function genderText(
    value
  ) {

    if (
      value === "female"
    ) {

      return currentLanguage === "zh"
        ? "女生"
        : "ผู้หญิง";

    }


    if (
      value === "male"
    ) {

      return currentLanguage === "zh"
        ? "男生"
        : "ผู้ชาย";

    }


    return value ||
      "-";

  }


  /* =========================================
     LANGUAGE TEXT
  ========================================= */

  function languageText(
    value
  ) {

    const key =
      String(
        value || ""
      )
        .trim()
        .toLowerCase();


    const map = {

      thai: {
        zh:
          "泰语",

        th:
          "ภาษาไทย"
      },

      chinese: {
        zh:
          "华语",

        th:
          "ภาษาจีน"
      },

      english: {
        zh:
          "英语",

        th:
          "ภาษาอังกฤษ"
      }

    };


    if (
      map[key]
    ) {

      return map[key][
        currentLanguage
      ];

    }


    return value;

  }


  /* =========================================
     LANGUAGE SWITCH
  ========================================= */

  function setLanguage(
    lang
  ) {

    currentLanguage =
      lang;


    localStorage.setItem(
      "sabaigo-language",
      lang
    );


    document
      .querySelectorAll(
        "[data-zh]"
      )
      .forEach(
        function(el) {

          const value =
            el.getAttribute(
              "data-" +
              lang
            );


          if (
            value !== null
          ) {

            el.textContent =
              value;

          }

        }
      );


    document
      .getElementById(
        "zhBtn"
      )
      .classList
      .toggle(
        "active",
        lang ===
          "zh"
      );


    document
      .getElementById(
        "thBtn"
      )
      .classList
      .toggle(
        "active",
        lang ===
          "th"
      );


    document.documentElement.lang =
      lang ===
        "zh"
        ? "zh"
        : "th";


    if (
      profile
    ) {

      renderProfile();

    }

  }


  /* =========================================
     HELPERS
  ========================================= */

  function splitValues(
    value
  ) {

    return String(
      value || ""
    )
      .split(
        /[,，]/
      )
      .map(
        item =>
          item.trim()
      )
      .filter(
        Boolean
      );

  }


  function escapeHtml(
    value
  ) {

    return String(
      value ??
      ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function escapeJs(
    value
  ) {

    return String(
      value ||
      ""
    )
      .replaceAll(
        "\\",
        "\\\\"
      )
      .replaceAll(
        "'",
        "\\'"
      );

  }


  /* =========================================
     NOT FOUND
  ========================================= */

  function showNotFound() {

    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "profilePage"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "notFound"
      )
      .style.display =
        "block";

  }


  /* =========================================
     START
  ========================================= */

  setLanguage(
    currentLanguage
  );


  loadProfile();

</script>

</body>
</html>
