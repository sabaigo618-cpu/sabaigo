<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SABAI GO - Companion Detail</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px 6%;

      background: rgba(0,0,0,.93);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
    }

    .logo span {
      color: #ff2ea6;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: #ccc;
      font-size: 14px;
    }

    .lang-btn {
      border: 1px solid #ff2ea6;
      background: transparent;
      color: white;

      padding: 7px 13px;
      border-radius: 20px;

      cursor: pointer;
    }

    .lang-btn.active {
      background: #ff2ea6;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 45px 20px 80px;

      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 45px;
    }

    .photo-card {
      position: sticky;
      top: 95px;
      height: fit-content;
    }

    .main-photo {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;

      border-radius: 22px;
      background: #111;

      border: 1px solid rgba(255,255,255,.08);
    }

    .status-row {
      margin-top: 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status {
      padding: 8px 13px;
      border-radius: 20px;

      background: rgba(24,180,100,.9);

      font-size: 13px;
      font-weight: bold;
    }

    .profile-code {
      color: #777;
      font-size: 12px;
    }

    .name {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .sub-info {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 25px;
      line-height: 1.7;
    }

    .section {
      background: #0e0e0e;
      border: 1px solid rgba(255,255,255,.07);

      border-radius: 18px;
      padding: 23px;

      margin-bottom: 18px;
    }

    .section h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .info-box {
      background: #151515;
      border-radius: 12px;
      padding: 14px;
    }

    .label {
      color: #777;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .value {
      font-size: 15px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: #191919;
      border: 1px solid #292929;

      padding: 8px 11px;
      border-radius: 18px;

      color: #ccc;
      font-size: 13px;
    }

    .description {
      color: #bbb;
      line-height: 1.8;
      font-size: 15px;
    }

    .price-box {
      background:
        linear-gradient(
          135deg,
          rgba(139,60,255,.18),
          rgba(255,46,166,.15)
        );

      border: 1px solid rgba(255,46,166,.25);

      border-radius: 18px;

      padding: 24px;

      margin-bottom: 18px;
    }

    .price {
      font-size: 34px;
      font-weight: bold;
      color: #ff54b8;

      margin-bottom: 7px;
    }

    .price-note {
      color: #aaa;
      font-size: 13px;
    }

    .booking-btn {
      display: block;
      width: 100%;

      border: none;

      padding: 16px;

      border-radius: 12px;

      background:
        linear-gradient(
          90deg,
          #823cff,
          #ff2ea6
        );

      color: white;

      text-align: center;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      margin-top: 15px;
    }

    .notice {
      margin-top: 13px;

      color: #777;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .not-found {
      display: none;

      padding: 100px 20px;
      text-align: center;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,.07);

      color: #666;

      text-align: center;
      padding: 25px;

      font-size: 12px;
    }

    @media(max-width:850px) {

      .container {
        grid-template-columns: 1fr;
        max-width: 650px;
      }

      .photo-card {
        position: static;
      }

      .main-photo {
        max-height: 650px;
      }

    }

    @media(max-width:520px) {

      .topbar {
        padding: 13px 15px;
      }

      .logo {
        font-size: 23px;
      }

      .back-btn {
        display: none;
      }

      .container {
        padding: 22px 14px 60px;
        gap: 25px;
      }

      .name {
        font-size: 32px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

let currentLanguage =
  localStorage.getItem(
    "sabaigo-language"
  ) || "zh";


const params =
  new URLSearchParams(
    window.location.search
  );


const id =
  params.get("id");


const profile =
  profiles[id];


if (!profile) {

  document
    .getElementById("profilePage")
    .style.display = "none";

  document
    .getElementById("notFound")
    .style.display = "block";

}
else {

  renderProfile();

}


function renderProfile() {

  document
    .getElementById("mainPhoto")
    .src = profile.photo;


  document
    .getElementById("name")
    .textContent =
      profile.name;


  document
    .getElementById("profileCode")
    .textContent =
      profile.code;


  document
    .getElementById("age")
    .textContent =
      profile.age;


  document
    .getElementById("area")
    .textContent =
      profile.area;


  document
    .getElementById("gender")
    .textContent =
      profile.gender[
        currentLanguage
      ];


  document
    .getElementById(
      "serviceType"
    )
    .textContent =
      profile.serviceType[
        currentLanguage
      ];


  document
    .getElementById("price")
    .textContent =
      "RM" +
      profile.price +
      " / " +
      (
        currentLanguage === "zh"
        ? "小时"
        : "ชั่วโมง"
      );


  document
    .getElementById("minimum")
    .textContent =
      currentLanguage === "zh"

      ? "最低预约 " +
        profile.minimum +
        " 小时"

      : "ขั้นต่ำ " +
        profile.minimum +
        " ชั่วโมง";


  document
    .getElementById("subInfo")
    .textContent =
      "📍 " +
      profile.area +
      " · " +
      profile.serviceType[
        currentLanguage
      ];


  document
    .getElementById(
      "description"
    )
    .textContent =
      profile.description[
        currentLanguage
      ];


  renderTags(
    "languages",
    profile.languages[
      currentLanguage
    ]
  );


  renderTags(
    "services",
    profile.services[
      currentLanguage
    ]
  );


  const status =
    document
      .getElementById("status");


  if (
    profile.status ===
    "available"
  ) {

    status.textContent =
      currentLanguage === "zh"
      ? "● Available"
      : "● ว่าง";

    status.style.background =
      "rgba(24,180,100,.9)";

  }

  else {

    status.textContent =
      currentLanguage === "zh"
      ? "● Busy"
      : "● ไม่ว่าง";

    status.style.background =
      "rgba(235,150,20,.92)";

  }


  const bookingBtn =
    document
      .getElementById(
        "bookingBtn"
      );


  bookingBtn.textContent =
    currentLanguage === "zh"
    ? "立即预约"
    : "จองตอนนี้";


  bookingBtn.href =
    "booking.html?id=" +
    id;

}


function renderTags(
  elementId,
  items
) {

  const box =
    document
      .getElementById(
        elementId
      );


  box.innerHTML = "";


  items.forEach(
    function(item) {

      const span =
        document.createElement(
          "span"
        );

      span.className =
        "tag";

      span.textContent =
        item;

      box.appendChild(
        span
      );

    }
  );

}


function setLanguage(lang) {

  currentLanguage =
    lang;


  localStorage.setItem(
    "sabaigo-language",
    lang
  );


  document
    .querySelectorAll(
      "[data-zh]"
    )
    .forEach(
      function(el) {

        const value =
          el.getAttribute(
            "data-" + lang
          );

        if (
          value !== null
        ) {

          el.textContent =
            value;

        }

      }
    );


  document
    .getElementById(
      "zhBtn"
    )
    .classList
    .toggle(
      "active",
      lang === "zh"
    );


  document
    .getElementById(
      "thBtn"
    )
    .classList
    .toggle(
      "active",
      lang === "th"
    );


  document.documentElement.lang =
    lang === "zh"
    ? "zh"
    : "th";


  if (profile) {

    renderProfile();

  }

}


setLanguage(
  currentLanguage
);

</script>

</body>
</html>
