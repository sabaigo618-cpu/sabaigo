<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SABAI GO - Companion Detail</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px 6%;

      background: rgba(0,0,0,.93);
      border-bottom: 1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
    }

    .logo span {
      color: #ff2ea6;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: #ccc;
      font-size: 14px;
    }

    .lang-btn {
      border: 1px solid #ff2ea6;
      background: transparent;
      color: white;

      padding: 7px 13px;
      border-radius: 20px;

      cursor: pointer;
    }

    .lang-btn.active {
      background: #ff2ea6;
    }

    .container {
      max-width: 1150px;
      margin: auto;

      padding: 45px 20px 80px;

      display: grid;
      grid-template-columns: 420px 1fr;

      gap: 45px;
    }

    .photo-card {
      position: sticky;
      top: 95px;
      height: fit-content;
    }

    .main-photo {
      width: 100%;
      aspect-ratio: 3 / 4;

      object-fit: cover;

      border-radius: 22px;

      background: #111;

      border: 1px solid rgba(255,255,255,.08);
    }

    .photo-placeholder {
      width: 100%;
      aspect-ratio: 3 / 4;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #26102c,
          #111
        );

      color: #666;
    }

    .status-row {
      margin-top: 15px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .status {
      padding: 8px 13px;

      border-radius: 20px;

      font-size: 13px;
      font-weight: bold;
    }

    .available {
      background: rgba(24,180,100,.9);
    }

    .busy {
      background: rgba(235,150,20,.92);
    }

    .off {
      background: rgba(90,90,90,.9);
    }

    .profile-code {
      color: #777;
      font-size: 12px;
    }

    .name {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .sub-info {
      color: #aaa;

      font-size: 15px;

      margin-bottom: 25px;

      line-height: 1.7;
    }

    .price-box {
      background:
        linear-gradient(
          135deg,
          rgba(139,60,255,.18),
          rgba(255,46,166,.15)
        );

      border: 1px solid rgba(255,46,166,.25);

      border-radius: 18px;

      padding: 24px;

      margin-bottom: 18px;
    }

    .label {
      color: #777;
      font-size: 11px;

      margin-bottom: 6px;
    }

    .price {
      font-size: 34px;
      font-weight: bold;

      color: #ff54b8;

      margin-bottom: 7px;
    }

    .price-note {
      color: #aaa;
      font-size: 13px;
    }

    .section {
      background: #0e0e0e;

      border: 1px solid rgba(255,255,255,.07);

      border-radius: 18px;

      padding: 23px;

      margin-bottom: 18px;
    }

    .section h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .info-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 14px;
    }

    .info-box {
      background: #151515;

      border-radius: 12px;

      padding: 14px;
    }

    .value {
      font-size: 15px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;
    }

    .tag {
      background: #191919;

      border: 1px solid #292929;

      padding: 8px 11px;

      border-radius: 18px;

      color: #ccc;

      font-size: 13px;
    }

    .description {
      color: #bbb;

      line-height: 1.8;

      font-size: 15px;
    }

    /* WhatsApp Button */

    .whatsapp-btn {
      display: block;

      width: 100%;

      border: none;

      padding: 16px;

      border-radius: 12px;

      background:
        linear-gradient(
          90deg,
          #25D366,
          #17aa50
        );

      color: white;

      text-align: center;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      margin-top: 15px;

      transition: .2s;
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px);
      opacity: .94;
    }

    .contact-note {
      margin-top: 13px;

      color: #777;

      font-size: 11px;

      line-height: 1.6;

      text-align: center;
    }

    .loading,
    .not-found {
      padding: 100px 20px;

      text-align: center;

      color: #888;
    }

    .not-found {
      display: none;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,.07);

      color: #666;

      text-align: center;

      padding: 25px;

      font-size: 12px;
    }

    @media(max-width:850px) {

      .container {
        grid-template-columns: 1fr;

        max-width: 650px;
      }

      .photo-card {
        position: static;
      }

      .main-photo {
        max-height: 650px;
      }

    }

    @media(max-width:520px) {

      .topbar {
        padding: 13px 15px;
      }

      .logo {
        font-size: 23px;
      }

      .back-btn {
        display: none;
      }

      .container {
        padding: 22px 14px 60px;

        gap: 25px;
      }

      .name {
        font-size: 32px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

<header class="topbar">

  <a href="index.html" class="logo">
    SABAI <span>GO</span>
  </a>

  <div class="top-right">

    <a
      href="companions.html"
      class="back-btn"
      data-zh="← 返回列表"
      data-th="← กลับไปหน้ารายการ">
      ← 返回列表
    </a>

    <button
      id="zhBtn"
      class="lang-btn active"
      onclick="setLanguage('zh')">
      中文
    </button>

    <button
      id="thBtn"
      class="lang-btn"
      onclick="setLanguage('th')">
      ไทย
    </button>

  </div>

</header>


<div
  id="loading"
  class="loading">
  Loading...
</div>


<div
  id="profilePage"
  style="display:none;">

  <main class="container">

    <div class="photo-card">

      <div id="photoBox"></div>


      <div class="status-row">

        <span
          id="status"
          class="status">
        </span>

        <span
          id="profileCode"
          class="profile-code">
        </span>

      </div>

    </div>


    <div>

      <h1
        id="name"
        class="name">
      </h1>


      <div
        id="subInfo"
        class="sub-info">
      </div>


      <div class="price-box">

        <div
          class="label"
          data-zh="价格"
          data-th="ราคา">
          价格
        </div>


        <div
          id="price"
          class="price">
        </div>


        <div
          id="minimum"
          class="price-note">
        </div>

      </div>


      <section class="section">

        <h2
          data-zh="基本资料"
          data-th="ข้อมูลพื้นฐาน">
          基本资料
        </h2>


        <div class="info-grid">

          <div class="info-box">

            <div
              class="label"
              data-zh="年龄"
              data-th="อายุ">
              年龄
            </div>

            <div
              id="age"
              class="value">
            </div>

          </div>


          <div class="info-box">

            <div
              class="label"
              data-zh="地区"
              data-th="พื้นที่">
              地区
            </div>

            <div
              id="area"
              class="value">
            </div>

          </div>


          <div class="info-box">

            <div
              class="label"
              data-zh="性别"
              data-th="เพศ">
              性别
            </div>

            <div
              id="gender"
              class="value">
            </div>

          </div>


          <div class="info-box">

            <div
              class="label"
              data-zh="服务类型"
              data-th="ประเภทบริการ">
              服务类型
            </div>

            <div
              id="serviceType"
              class="value">
            </div>

          </div>


          <div class="info-box">

            <div
              class="label"
              data-zh="可联系时间"
              data-th="เวลาที่ติดต่อได้">
              可联系时间
            </div>

            <div
              id="availableTime"
              class="value">
            </div>

          </div>

        </div>

      </section>


      <section class="section">

        <h2
          data-zh="语言"
          data-th="ภาษา">
          语言
        </h2>

        <div
          id="languages"
          class="tags">
        </div>

      </section>


      <section class="section">

        <h2
          data-zh="陪同项目"
          data-th="กิจกรรม">
          陪同项目
        </h2>

        <div
          id="services"
          class="tags">
        </div>

      </section>


      <section class="section">

        <h2
          data-zh="个人介绍"
          data-th="แนะนำตัว">
          个人介绍
        </h2>

        <p
          id="description"
          class="description">
        </p>

      </section>


      <!-- 直接 WhatsApp -->

      <a
        href="#"
        id="whatsappBtn"
        class="whatsapp-btn"
        onclick="contactWhatsApp(); return false;"
        data-zh="💬 WhatsApp 联系"
        data-th="💬 ติดต่อผ่าน WhatsApp">
        💬 WhatsApp 联系
      </a>


      <div
        class="contact-note"
        data-zh="点击按钮后将直接打开 WhatsApp 联系 SABAI GO。"
        data-th="กดปุ่มเพื่อเปิด WhatsApp และติดต่อ SABAI GO">
        点击按钮后将直接打开 WhatsApp 联系 SABAI GO。
      </div>

    </div>

  </main>

</div>


<div
  id="notFound"
  class="not-found">

  <h2
    data-zh="找不到这个资料"
    data-th="ไม่พบโปรไฟล์นี้">
    找不到这个资料
  </h2>

  <br>

  <a
    href="companions.html"
    style="color:#ff4eb3;"
    data-zh="返回人物列表"
    data-th="กลับไปหน้ารายการ">
    返回人物列表
  </a>

</div>


<footer>
  © 2026 SABAI GO
</footer>


<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://xfezhdqakmyecregqesn.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_AuNzm5CWOK2B2Pa7Pn_wBA_pAqHVpI2";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     WHATSAPP
  ========================================= */

  const WHATSAPP_NUMBER =
    "601163803627";


  let profile = null;


  let currentLanguage =
    localStorage.getItem(
      "sabaigo-language"
    ) || "zh";


  const params =
    new URLSearchParams(
      window.location.search
    );


  const slug =
    params.get("id");


  /* =========================================
     LOAD PROFILE
  ========================================= */

  async function loadProfile() {

    if (!slug) {

      showNotFound();

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("companions")
        .select("*")
        .eq(
          "slug",
          slug
        )
        .eq(
          "is_published",
          true
        )
        .maybeSingle();


    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


    if (
      error ||
      !data
    ) {

      console.error(
        error
      );

      showNotFound();

      return;

    }


    profile =
      data;


    document
      .getElementById(
        "profilePage"
      )
      .style.display =
        "block";


    renderProfile();

  }


  /* =========================================
     RENDER
  ========================================= */

  function renderProfile() {

    if (!profile) {
      return;
    }


    const photoBox =
      document
        .getElementById(
          "photoBox"
        );


    if (
      profile.cover_image
    ) {

      photoBox.innerHTML = `
        <img
          class="main-photo"
          src="${escapeHtml(profile.cover_image)}"
          alt="${escapeHtml(profile.nickname || "")}">
      `;

    }
    else {

      photoBox.innerHTML = `
        <div class="photo-placeholder">
          No Image
        </div>
      `;

    }


    document
      .getElementById(
        "name"
      )
      .textContent =
        profile.nickname ||
        "-";


    document
      .getElementById(
        "profileCode"
      )
      .textContent =
        profile.slug ||
        "";


    document
      .getElementById(
        "age"
      )
      .textContent =
        profile.age ||
        "-";


    document
      .getElementById(
        "area"
      )
      .textContent =
        profile.area ||
        "-";


    document
      .getElementById(
        "gender"
      )
      .textContent =
        genderText(
          profile.gender
        );


    document
      .getElementById(
        "serviceType"
      )
      .textContent =
        serviceTypeText(
          profile.service_type
        );


    document
      .getElementById(
        "availableTime"
      )
      .textContent =
        profile.available_time ||
        "-";


    document
      .getElementById(
        "price"
      )
      .textContent =
        "RM" +
        (
          profile.price_per_hour ??
          0
        ) +
        (
          currentLanguage === "zh"
            ? " / 小时"
            : " / ชั่วโมง"
        );


    document
      .getElementById(
        "minimum"
      )
      .textContent =
        currentLanguage === "zh"
          ? "最低 " +
            (
              profile.minimum_hours ||
              0
            ) +
            " 小时"
          : "ขั้นต่ำ " +
            (
              profile.minimum_hours ||
              0
            ) +
            " ชั่วโมง";


    document
      .getElementById(
        "subInfo"
      )
      .textContent =
        "📍 " +
        (
          profile.area ||
          "-"
        ) +
        " · " +
        serviceTypeText(
          profile.service_type
        );


    document
      .getElementById(
        "description"
      )
      .textContent =
        currentLanguage === "zh"
          ? (
              profile.description_zh ||
              ""
            )
          : (
              profile.description_th ||
              ""
            );


    renderLanguageTags();

    renderServiceTags();

    renderStatus();


    document
      .getElementById(
        "whatsappBtn"
      )
      .textContent =
        currentLanguage === "zh"
          ? "💬 WhatsApp 联系"
          : "💬 ติดต่อผ่าน WhatsApp";

  }


  /* =========================================
     WHATSAPP DIRECT CONTACT
  ========================================= */

  function contactWhatsApp() {

    if (!profile) {
      return;
    }


    const nickname =
      profile.nickname ||
      "-";


    const slug =
      profile.slug ||
      "-";


    const area =
      profile.area ||
      "-";


    const price =
      profile.price_per_hour ??
      0;


    let message;


    if (
      currentLanguage === "zh"
    ) {

      message =
`你好 SABAI GO，我想咨询这个资料。

人物：${nickname}
编号：${slug}
地区：${area}
价格：RM${price} / 小时

请问现在可以安排吗？`;

    }
    else {

      message =
`สวัสดี SABAI GO ฉันต้องการสอบถามโปรไฟล์นี้

ชื่อ: ${nickname}
รหัส: ${slug}
พื้นที่: ${area}
ราคา: RM${price} / ชั่วโมง

ตอนนี้สามารถนัดได้ไหม?`;

    }


    const url =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(
        message
      );


    window.location.href =
      url;

  }


  /* =========================================
     LANGUAGES
  ========================================= */

  function renderLanguageTags() {

    const box =
      document
        .getElementById(
          "languages"
        );


    box.innerHTML =
      "";


    if (
      !profile.languages
    ) {

      return;

    }


    profile.languages
      .split(",")
      .map(
        item =>
          item.trim()
      )
      .filter(Boolean)
      .forEach(
        function(item) {

          const span =
            document.createElement(
              "span"
            );


          span.className =
            "tag";


          span.textContent =
            languageText(
              item
            );


          box.appendChild(
            span
          );

        }
      );

  }


  /* =========================================
     SERVICES
  ========================================= */

  function renderServiceTags() {

    const box =
      document
        .getElementById(
          "services"
        );


    box.innerHTML =
      "";


    const value =
      currentLanguage === "zh"
        ? profile.services_zh
        : profile.services_th;


    if (!value) {
      return;
    }


    value
      .split(",")
      .map(
        item =>
          item.trim()
      )
      .filter(Boolean)
      .forEach(
        function(item) {

          const span =
            document.createElement(
              "span"
            );


          span.className =
            "tag";


          span.textContent =
            item;


          box.appendChild(
            span
          );

        }
      );

  }


  /* =========================================
     STATUS
  ========================================= */

  function renderStatus() {

    const status =
      document
        .getElementById(
          "status"
        );


    status.className =
      "status " +
      statusClass(
        profile.status
      );


    status.textContent =
      statusText(
        profile.status
      );

  }


  function statusClass(
    value
  ) {

    if (
      value === "available"
    ) {

      return "available";

    }


    if (
      value === "busy"
    ) {

      return "busy";

    }


    return "off";

  }


  function statusText(
    value
  ) {

    if (
      value === "available"
    ) {

      return currentLanguage === "zh"
        ? "● Available"
        : "● ว่าง";

    }


    if (
      value === "busy"
    ) {

      return currentLanguage === "zh"
        ? "● Busy"
        : "● ไม่ว่าง";

    }


    return currentLanguage === "zh"
      ? "● Off"
      : "● ปิด";

  }


  /* =========================================
     GENDER
  ========================================= */

  function genderText(
    value
  ) {

    if (
      value === "female"
    ) {

      return currentLanguage === "zh"
        ? "女生"
        : "ผู้หญิง";

    }


    if (
      value === "male"
    ) {

      return currentLanguage === "zh"
        ? "男生"
        : "ผู้ชาย";

    }


    return value || "-";

  }


  /* =========================================
     SERVICE TYPE
  ========================================= */

  function serviceTypeText(
    value
  ) {

    if (
      value === "party"
    ) {

      return "Party Companion";

    }


    if (
      value === "girlfriend"
    ) {

      return currentLanguage === "zh"
        ? "1日女友"
        : "แฟน 1 วัน";

    }


    if (
      value === "boyfriend"
    ) {

      return currentLanguage === "zh"
        ? "1日男友"
        : "แฟน 1 วัน (ผู้ชาย)";

    }


    return value || "-";

  }


  /* =========================================
     LANGUAGE TEXT
  ========================================= */

  function languageText(
    value
  ) {

    const key =
      value
        .trim()
        .toLowerCase();


    const map = {

      thai: {
        zh: "泰语",
        th: "ภาษาไทย"
      },

      chinese: {
        zh: "华语",
        th: "ภาษาจีน"
      },

      english: {
        zh: "英语",
        th: "ภาษาอังกฤษ"
      }

    };


    if (
      map[key]
    ) {

      return map[key][
        currentLanguage
      ];

    }


    return value;

  }


  /* =========================================
     LANGUAGE SWITCH
  ========================================= */

  function setLanguage(
    lang
  ) {

    currentLanguage =
      lang;


    localStorage.setItem(
      "sabaigo-language",
      lang
    );


    document
      .querySelectorAll(
        "[data-zh]"
      )
      .forEach(
        function(el) {

          const value =
            el.getAttribute(
              "data-" +
              lang
            );


          if (
            value !== null
          ) {

            el.textContent =
              value;

          }

        }
      );


    document
      .getElementById(
        "zhBtn"
      )
      .classList
      .toggle(
        "active",
        lang === "zh"
      );


    document
      .getElementById(
        "thBtn"
      )
      .classList
      .toggle(
        "active",
        lang === "th"
      );


    document.documentElement.lang =
      lang === "zh"
        ? "zh"
        : "th";


    if (
      profile
    ) {

      renderProfile();

    }

  }


  /* =========================================
     NOT FOUND
  ========================================= */

  function showNotFound() {

    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "profilePage"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "notFound"
      )
      .style.display =
        "block";

  }


  /* =========================================
     SAFE HTML
  ========================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =========================================
     START
  ========================================= */

  setLanguage(
    currentLanguage
  );


  loadProfile();

</script>
