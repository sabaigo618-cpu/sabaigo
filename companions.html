<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SABAI GO - Companion</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px 6%;

      background: rgba(0,0,0,.93);
      border-bottom: 1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #ff2ea6;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .home-link {
      font-size: 14px;
      color: #ccc;
    }

    .lang-switch {
      display: flex;
      gap: 7px;
    }

    .lang-btn {
      border: 1px solid #ff2ea6;
      background: transparent;
      color: white;

      padding: 7px 13px;
      border-radius: 20px;

      cursor: pointer;
    }

    .lang-btn.active {
      background: #ff2ea6;
    }

    .page-header {
      text-align: center;

      padding: 65px 20px 45px;

      background:
        radial-gradient(
          circle at top,
          rgba(139,60,255,.28),
          transparent 40%
        ),
        radial-gradient(
          circle at right,
          rgba(255,46,166,.18),
          transparent 35%
        );
    }

    .page-header .small-title {
      color: #ff56b8;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 13px;
    }

    .page-header h1 {
      font-size: 43px;
      margin-bottom: 14px;
    }

    .page-header p {
      color: #aaa;
      line-height: 1.7;
      font-size: 16px;
    }

    .service-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;

      padding: 25px 20px 10px;

      flex-wrap: wrap;
    }

    .tab-btn {
      border: 1px solid rgba(255,255,255,.13);

      background: #111;
      color: #bbb;

      padding: 11px 18px;
      border-radius: 25px;

      cursor: pointer;
      font-size: 14px;

      transition: .2s;
    }

    .tab-btn:hover {
      border-color: #ff2ea6;
      color: white;
    }

    .tab-btn.active {
      background: linear-gradient(
        90deg,
        #8b3cff,
        #ff2ea6
      );

      border-color: transparent;
      color: white;
    }

    .filter-wrap {
      max-width: 1200px;

      margin: 20px auto 30px;

      padding: 0 20px;
    }

    .filter-box {
      background: #0d0d0d;

      border: 1px solid rgba(255,255,255,.08);

      padding: 18px;

      border-radius: 18px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      gap: 12px;
    }

    .filter-box select {
      width: 100%;

      background: #171717;
      border: 1px solid #2b2b2b;
      color: white;

      padding: 12px;
      border-radius: 10px;

      outline: none;
    }

    .result-info {
      max-width: 1200px;
      margin: auto;

      padding: 0 20px 16px;

      color: #888;
      font-size: 14px;
    }

    .cards {
      max-width: 1200px;
      margin: auto;

      padding: 0 20px 70px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      gap: 22px;
    }

    .card {
      background: #101010;

      border-radius: 18px;
      overflow: hidden;

      border: 1px solid rgba(255,255,255,.08);

      transition: .25s;
    }

    .card:hover {
      transform: translateY(-6px);

      border-color: rgba(255,46,166,.45);

      box-shadow:
        0 18px 45px rgba(255,46,166,.11);
    }

    .photo-wrap {
      position: relative;

      width: 100%;
      aspect-ratio: 3 / 4;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #26102c,
          #0d0d0d
        );
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      display: block;
    }

    .status {
      position: absolute;

      top: 12px;
      left: 12px;

      padding: 7px 11px;

      border-radius: 20px;

      font-size: 12px;
      font-weight: bold;

      backdrop-filter: blur(8px);
    }

    .available {
      background: rgba(24,180,100,.9);
    }

    .busy {
      background: rgba(235,150,20,.92);
    }

    .off {
      background: rgba(90,90,90,.9);
    }

    .type-badge {
      position: absolute;

      right: 12px;
      bottom: 12px;

      background: rgba(0,0,0,.75);

      padding: 7px 10px;
      border-radius: 15px;

      font-size: 11px;
      color: #eee;
    }

    .card-body {
      padding: 17px;
    }

    .name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;

      margin-bottom: 9px;
    }

    .name {
      font-size: 21px;
      font-weight: bold;
    }

    .age {
      color: #999;
      font-size: 13px;
    }

    .location {
      color: #aaa;
      font-size: 13px;

      margin-bottom: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;

      margin-bottom: 13px;
    }

    .tag {
      background: #1b1b1b;
      border: 1px solid #292929;

      padding: 6px 9px;

      border-radius: 15px;

      color: #bbb;
      font-size: 11px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: end;

      padding-top: 13px;

      border-top: 1px solid rgba(255,255,255,.07);
    }

    .price-label {
      color: #777;
      font-size: 11px;

      margin-bottom: 3px;
    }

    .price {
      color: #ff4eb3;

      font-size: 21px;
      font-weight: bold;
    }

    .minimum {
      color: #888;
      font-size: 11px;

      text-align: right;
    }

    .view-btn {
      display: block;
      width: 100%;

      margin-top: 15px;
      padding: 11px;

      border-radius: 9px;

      text-align: center;

      background:
        linear-gradient(
          90deg,
          #873cff,
          #ff2ea6
        );

      font-weight: bold;
      font-size: 13px;
    }

    .loading,
    .empty {
      max-width: 1200px;

      margin: auto;

      padding: 60px 20px 90px;

      text-align: center;

      color: #777;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,.07);

      padding: 28px 20px;

      text-align: center;

      color: #666;
      font-size: 12px;
    }

    @media(max-width:1000px) {

      .cards {
        grid-template-columns: repeat(3, 1fr);
      }

      .filter-box {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media(max-width:750px) {

      .cards {
        grid-template-columns: repeat(2, 1fr);

        gap: 13px;

        padding-left: 13px;
        padding-right: 13px;
      }

      .filter-wrap {
        padding: 0 13px;
      }

      .page-header {
        padding-top: 45px;
      }

      .page-header h1 {
        font-size: 34px;
      }

      .topbar {
        padding: 13px 15px;
      }

      .logo {
        font-size: 23px;
      }

      .home-link {
        display: none;
      }

    }

    @media(max-width:480px) {

      .filter-box {
        grid-template-columns: 1fr;
      }

      .card-body {
        padding: 13px;
      }

      .name {
        font-size: 18px;
      }

      .price {
        font-size: 18px;
      }

    }
  </style>
</head>

<body>


<header class="topbar">

  <a href="index.html" class="logo">
    SABAI <span>GO</span>
  </a>

  <div class="top-right">

    <a
      href="index.html"
      class="home-link"
      data-zh="首页"
      data-th="หน้าหลัก">
      首页
    </a>

    <div class="lang-switch">

      <button
        id="zhBtn"
        class="lang-btn active"
        onclick="setLanguage('zh')">
        中文
      </button>

      <button
        id="thBtn"
        class="lang-btn"
        onclick="setLanguage('th')">
        ไทย
      </button>

    </div>

  </div>

</header>


<section class="page-header">

  <div class="small-title">
    SABAI GO COMPANION
  </div>

  <h1
    data-zh="找到今晚适合你的陪伴"
    data-th="ค้นหาเพื่อนที่เหมาะกับคืนนี้">
    找到今晚适合你的陪伴
  </h1>

  <p
    data-zh="浏览资料、地区、语言、服务类型与价格，再选择适合你的陪伴。"
    data-th="ดูโปรไฟล์ พื้นที่ ภาษา ประเภทบริการ และราคา ก่อนเลือกเพื่อนที่เหมาะกับคุณ">
    浏览资料、地区、语言、服务类型与价格，再选择适合你的陪伴。
  </p>

</section>


<div class="service-tabs">

  <button
    class="tab-btn active"
    data-type="all"
    onclick="setType('all',this)"
    data-zh="全部"
    data-th="ทั้งหมด">
    全部
  </button>

  <button
    class="tab-btn"
    data-type="party"
    onclick="setType('party',this)">
    Party Companion
  </button>

  <button
    class="tab-btn"
    data-type="girlfriend"
    onclick="setType('girlfriend',this)"
    data-zh="1日女友"
    data-th="แฟน 1 วัน">
    1日女友
  </button>

  <button
    class="tab-btn"
    data-type="boyfriend"
    onclick="setType('boyfriend',this)"
    data-zh="1日男友"
    data-th="แฟน 1 วัน (ผู้ชาย)">
    1日男友
  </button>

</div>


<div class="filter-wrap">

  <div class="filter-box">

    <select
      id="areaFilter"
      onchange="renderCards()">

      <option
        value="all"
        data-zh="全部地区"
        data-th="ทุกพื้นที่">
        全部地区
      </option>

      <option value="Kuala Lumpur">
        Kuala Lumpur
      </option>

      <option value="Puchong">
        Puchong
      </option>

      <option value="Petaling Jaya">
        Petaling Jaya
      </option>

      <option value="Subang Jaya">
        Subang Jaya
      </option>

      <option value="Klang">
        Klang
      </option>

    </select>


    <select
      id="genderFilter"
      onchange="renderCards()">

      <option
        value="all"
        data-zh="全部性别"
        data-th="ทุกเพศ">
        全部性别
      </option>

      <option
        value="female"
        data-zh="女生"
        data-th="ผู้หญิง">
        女生
      </option>

      <option
        value="male"
        data-zh="男生"
        data-th="ผู้ชาย">
        男生
      </option>

    </select>


    <select
      id="languageFilter"
      onchange="renderCards()">

      <option
        value="all"
        data-zh="全部语言"
        data-th="ทุกภาษา">
        全部语言
      </option>

      <option value="thai"
        data-zh="泰语"
        data-th="ภาษาไทย">
        泰语
      </option>

      <option value="chinese"
        data-zh="华语"
        data-th="ภาษาจีน">
        华语
      </option>

      <option value="english"
        data-zh="英语"
        data-th="ภาษาอังกฤษ">
        英语
      </option>

    </select>


    <select
      id="statusFilter"
      onchange="renderCards()">

      <option
        value="all"
        data-zh="全部状态"
        data-th="ทุกสถานะ">
        全部状态
      </option>

      <option value="available">
        Available
      </option>

      <option value="busy">
        Busy
      </option>

      <option value="off">
        Off
      </option>

    </select>

  </div>

</div>


<div class="result-info">

  <span
    data-zh="找到"
    data-th="พบ">
    找到
  </span>

  <strong id="resultCount">
    0
  </strong>

  <span
    data-zh="位陪伴"
    data-th="โปรไฟล์">
    位陪伴
  </span>

</div>


<div
  id="loading"
  class="loading">
  Loading...
</div>


<main
  class="cards"
  id="cards"
  style="display:none;">
</main>


<div
  class="empty"
  id="empty"
  style="display:none;">

  <h2
    data-zh="暂时没有符合条件的资料"
    data-th="ยังไม่มีโปรไฟล์ที่ตรงกับเงื่อนไข">
    暂时没有符合条件的资料
  </h2>

</div>


<footer>
  © 2026 SABAI GO
</footer>


<script>

  const SUPABASE_URL =
    "https://xfezhdqakmyecregqesn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_AuNzm5CWOK2B2Pa7Pn_wBA_pAqHVpI2";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let companions = [];

  let currentType =
    "all";

  let currentLanguage =
    localStorage.getItem(
      "sabaigo-language"
    ) || "zh";


  async function loadCompanions() {

    document
      .getElementById("loading")
      .style.display =
        "block";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("companions")
        .select("*")
        .eq(
          "is_published",
          true
        )
        .order(
          "created_at",
          {
            ascending:
              false
          }
        );


    document
      .getElementById("loading")
      .style.display =
        "none";


    if (error) {

      console.error(
        error
      );


      document
        .getElementById("empty")
        .style.display =
          "block";


      document
        .getElementById("empty")
        .innerHTML =
          currentLanguage === "zh"
            ? "<h2>暂时无法读取人物资料</h2>"
            : "<h2>ไม่สามารถโหลดข้อมูลได้</h2>";

      return;

    }


    companions =
      data || [];


    renderCards();

  }


  function renderCards() {

    const cardsBox =
      document
        .getElementById("cards");


    const empty =
      document
        .getElementById("empty");


    const area =
      document
        .getElementById("areaFilter")
        .value;


    const gender =
      document
        .getElementById("genderFilter")
        .value;


    const language =
      document
        .getElementById("languageFilter")
        .value;


    const status =
      document
        .getElementById("statusFilter")
        .value;


    const filtered =
      companions.filter(
        function(item) {

          const typeMatch =
            currentType === "all" ||
            item.service_type ===
              currentType;


          const areaMatch =
            area === "all" ||
            item.area === area;


          const genderMatch =
            gender === "all" ||
            item.gender ===
              gender;


          const languages =
            (
              item.languages ||
              ""
            )
            .toLowerCase();


          const languageMatch =
            language === "all" ||
            languages.includes(
              language
            );


          const statusMatch =
            status === "all" ||
            item.status ===
              status;


          return (
            typeMatch &&
            areaMatch &&
            genderMatch &&
            languageMatch &&
            statusMatch
          );

        }
      );


    document
      .getElementById(
        "resultCount"
      )
      .textContent =
        filtered.length;


    cardsBox.innerHTML =
      "";


    if (
      filtered.length === 0
    ) {

      cardsBox.style.display =
        "none";


      empty.style.display =
        "block";


      empty.innerHTML =
        currentLanguage === "zh"
          ? "<h2>暂时没有符合条件的资料</h2>"
          : "<h2>ยังไม่มีโปรไฟล์ที่ตรงกับเงื่อนไข</h2>";

      return;

    }


    empty.style.display =
      "none";


    cardsBox.style.display =
      "grid";


    filtered.forEach(
      function(item) {

        const article =
          document.createElement(
            "article"
          );


        article.className =
          "card";


        const languages =
          createLanguageTags(
            item.languages
          );


        const services =
          createServiceTags(
            item
          );


        article.innerHTML = `
          <div class="photo-wrap">

            ${
              item.cover_image
                ? `
                  <img
                    src="${escapeHtml(item.cover_image)}"
                    alt="${escapeHtml(item.nickname || "")}">
                `
                : `
                  <div
                    style="
                      width:100%;
                      height:100%;
                      display:flex;
                      align-items:center;
                      justify-content:center;
                      color:#666;
                    ">
                    No Image
                  </div>
                `
            }

            <span
              class="status ${statusClass(item.status)}">
              ${statusText(item.status)}
            </span>

            <span class="type-badge">
              ${serviceTypeText(item.service_type)}
            </span>

          </div>


          <div class="card-body">

            <div class="name-row">

              <div class="name">
                ${escapeHtml(item.nickname || "-")}
              </div>

              <div class="age">
                ${
                  item.age
                    ? escapeHtml(item.age)
                    : "-"
                }
              </div>

            </div>


            <div class="location">
              📍 ${escapeHtml(item.area || "-")}
            </div>


            <div class="tags">

              ${languages}

              ${services}

            </div>


            <div class="price-row">

              <div>

                <div class="price-label">
                  ${
                    currentLanguage === "zh"
                      ? "每小时"
                      : "ต่อชั่วโมง"
                  }
                </div>

                <div class="price">
                  RM${item.price_per_hour ?? 0}
                </div>

              </div>


              <div class="minimum">
                ${
                  currentLanguage === "zh"
                    ? `最低 ${item.minimum_hours || 0} 小时`
                    : `ขั้นต่ำ ${item.minimum_hours || 0} ชั่วโมง`
                }
              </div>

            </div>


            <a
              href="companion-detail.html?id=${encodeURIComponent(item.slug)}"
              class="view-btn">

              ${
                currentLanguage === "zh"
                  ? "查看资料"
                  : "ดูโปรไฟล์"
              }

            </a>

          </div>
        `;


        cardsBox.appendChild(
          article
        );

      }
    );

  }


  function createLanguageTags(
    value
  ) {

    if (!value) {
      return "";
    }


    return value
      .split(",")
      .map(
        item =>
          item.trim()
      )
      .filter(Boolean)
      .map(
        function(item) {

          return `
            <span class="tag">
              ${languageText(item)}
            </span>
          `;

        }
      )
      .join("");

  }


  function createServiceTags(
    item
  ) {

    const value =
      currentLanguage === "zh"
        ? item.services_zh
        : item.services_th;


    if (!value) {
      return "";
    }


    return value
      .split(",")
      .map(
        item =>
          item.trim()
      )
      .filter(Boolean)
      .map(
        function(item) {

          return `
            <span class="tag">
              ${escapeHtml(item)}
            </span>
          `;

        }
      )
      .join("");

  }


  function languageText(
    value
  ) {

    const key =
      value
        .trim()
        .toLowerCase();


    const map = {

      thai: {
        zh: "泰语",
        th: "ภาษาไทย"
      },

      chinese: {
        zh: "华语",
        th: "ภาษาจีน"
      },

      english: {
        zh: "英语",
        th: "ภาษาอังกฤษ"
      }

    };


    if (
      map[key]
    ) {

      return map[key][
        currentLanguage
      ];

    }


    return escapeHtml(
      value
    );

  }


  function serviceTypeText(
    type
  ) {

    if (
      type ===
      "party"
    ) {

      return "Party Companion";

    }


    if (
      type ===
      "girlfriend"
    ) {

      return currentLanguage === "zh"
        ? "1日女友"
        : "แฟน 1 วัน";

    }


    if (
      type ===
      "boyfriend"
    ) {

      return currentLanguage === "zh"
        ? "1日男友"
        : "แฟน 1 วัน (ผู้ชาย)";

    }


    return type || "-";

  }


  function statusClass(
    status
  ) {

    if (
      status === "available"
    ) {

      return "available";

    }


    if (
      status === "busy"
    ) {

      return "busy";

    }


    return "off";

  }


  function statusText(
    status
  ) {

    if (
      status ===
      "available"
    ) {

      return currentLanguage === "zh"
        ? "● Available"
        : "● ว่าง";

    }


    if (
      status === "busy"
    ) {

      return currentLanguage === "zh"
        ? "● Busy"
        : "● ไม่ว่าง";

    }


    return currentLanguage === "zh"
      ? "● Off"
      : "● ปิด";

  }


  function setType(
    type,
    button
  ) {

    currentType =
      type;


    document
      .querySelectorAll(
        ".tab-btn"
      )
      .forEach(
        function(btn) {

          btn.classList.remove(
            "active"
          );

        }
      );


    button.classList.add(
      "active"
    );


    renderCards();

  }


  function setLanguage(
    lang
  ) {

    currentLanguage =
      lang;


    localStorage.setItem(
      "sabaigo-language",
      lang
    );


    document
      .querySelectorAll(
        "[data-zh]"
      )
      .forEach(
        function(el) {

          const value =
            el.getAttribute(
              "data-" +
              lang
            );


          if (
            value !== null
          ) {

            el.textContent =
              value;

          }

        }
      );


    document
      .getElementById(
        "zhBtn"
      )
      .classList
      .toggle(
        "active",
        lang === "zh"
      );


    document
      .getElementById(
        "thBtn"
      )
      .classList
      .toggle(
        "active",
        lang === "th"
      );


    document.documentElement.lang =
      lang === "zh"
        ? "zh"
        : "th";


    renderCards();

  }


  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  const params =
    new URLSearchParams(
      window.location.search
    );


  const typeFromUrl =
    params.get(
      "type"
    );


  if (
    typeFromUrl ===
    "party"
  ) {

    currentType =
      "party";

  }


  if (
    typeFromUrl ===
    "girlfriend"
  ) {

    currentType =
      "girlfriend";

  }


  if (
    typeFromUrl ===
    "boyfriend"
  ) {

    currentType =
      "boyfriend";

  }


  setLanguage(
    currentLanguage
  );


  loadCompanions();

</script>

</body>
</html>
