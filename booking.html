<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SABAI GO - Booking</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px 6%;

      background: rgba(0,0,0,.93);
      border-bottom: 1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
    }

    .logo span {
      color: #ff2ea6;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-link {
      color: #ccc;
      font-size: 14px;
    }

    .lang-btn {
      border: 1px solid #ff2ea6;
      background: transparent;
      color: #fff;

      padding: 7px 13px;
      border-radius: 20px;

      cursor: pointer;
    }

    .lang-btn.active {
      background: #ff2ea6;
    }

    .page-header {
      padding: 55px 20px 35px;

      text-align: center;

      background:
        radial-gradient(
          circle at top,
          rgba(139,60,255,.25),
          transparent 38%
        ),
        radial-gradient(
          circle at right,
          rgba(255,46,166,.18),
          transparent 32%
        );
    }

    .page-header h1 {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .page-header p {
      color: #aaa;
      line-height: 1.7;
      font-size: 15px;
    }

    .loading,
    .not-found {
      padding: 100px 20px;
      text-align: center;
      color: #888;
    }

    .not-found {
      display: none;
    }

    .container {
      max-width: 1080px;
      margin: auto;

      padding: 35px 20px 80px;

      display: grid;
      grid-template-columns: 360px 1fr;

      gap: 30px;
    }

    .summary-card {
      background: #0e0e0e;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 20px;

      padding: 20px;

      height: fit-content;

      position: sticky;
      top: 95px;
    }

    .profile-box {
      display: flex;
      align-items: center;

      gap: 15px;

      margin-bottom: 20px;
    }

    .profile-photo {
      width: 85px;
      height: 105px;

      border-radius: 14px;

      object-fit: cover;

      background: #181818;
    }

    .profile-placeholder {
      width: 85px;
      height: 105px;

      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #181818;

      color: #666;

      font-size: 11px;
    }

    .profile-name {
      font-size: 23px;
      font-weight: bold;

      margin-bottom: 7px;
    }

    .profile-area {
      color: #999;
      font-size: 13px;
      line-height: 1.5;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;

      gap: 15px;

      padding: 13px 0;

      border-top: 1px solid rgba(255,255,255,.07);

      font-size: 14px;
    }

    .summary-label {
      color: #777;
    }

    .summary-value {
      text-align: right;
      font-weight: bold;
    }

    .total-box {
      margin-top: 15px;

      padding: 18px;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          rgba(139,60,255,.2),
          rgba(255,46,166,.17)
        );

      border: 1px solid rgba(255,46,166,.25);
    }

    .total-label {
      color: #aaa;
      font-size: 12px;

      margin-bottom: 5px;
    }

    .total-price {
      color: #ff50b7;

      font-size: 32px;
      font-weight: bold;
    }

    .form-card {
      background: #0e0e0e;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 20px;

      padding: 25px;
    }

    .form-card h2 {
      font-size: 20px;
      margin-bottom: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: #aaa;
      font-size: 13px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;

      background: #171717;
      border: 1px solid #2c2c2c;

      color: #fff;

      padding: 13px 14px;

      border-radius: 10px;

      outline: none;

      font-size: 14px;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #ff2ea6;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .booking-note {
      margin-top: 20px;

      padding: 15px;

      background: #151515;

      border-radius: 12px;

      color: #999;

      font-size: 12px;

      line-height: 1.7;
    }

    .submit-btn {
      width: 100%;

      margin-top: 20px;

      padding: 15px;

      border: none;

      border-radius: 11px;

      background:
        linear-gradient(
          90deg,
          #25D366,
          #16a34a
        );

      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .submit-btn:hover {
      opacity: .92;
    }

    .message {
      display: none;

      margin-top: 18px;

      padding: 15px;

      border-radius: 12px;

      text-align: center;

      line-height: 1.6;

      font-size: 14px;
    }

    .message.error {
      display: block;

      background: rgba(220,55,80,.12);

      border: 1px solid rgba(220,55,80,.35);

      color: #ff9bad;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,.07);

      padding: 26px;

      text-align: center;

      color: #666;

      font-size: 12px;
    }

    @media(max-width:850px) {

      .container {
        grid-template-columns: 1fr;
        max-width: 650px;
      }

      .summary-card {
        position: static;
      }

    }

    @media(max-width:560px) {

      .topbar {
        padding: 13px 15px;
      }

      .logo {
        font-size: 23px;
      }

      .back-link {
        display: none;
      }

      .page-header h1 {
        font-size: 32px;
      }

      .container {
        padding: 22px 14px 60px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

    }
  </style>
</head>

<body>

<header class="topbar">

  <a href="index.html" class="logo">
    SABAI <span>GO</span>
  </a>

  <div class="top-right">

    <a
      id="backLink"
      href="companions.html"
      class="back-link"
      data-zh="← 返回资料"
      data-th="← กลับไปโปรไฟล์">
      ← 返回资料
    </a>

    <button
      id="zhBtn"
      class="lang-btn active"
      onclick="setLanguage('zh')">
      中文
    </button>

    <button
      id="thBtn"
      class="lang-btn"
      onclick="setLanguage('th')">
      ไทย
    </button>

  </div>

</header>


<div id="loading" class="loading">
  Loading...
</div>


<div
  id="bookingPage"
  style="display:none;">

  <section class="page-header">

    <h1
      data-zh="提交预约"
      data-th="ส่งคำขอจอง">
      提交预约
    </h1>

    <p
      data-zh="填写预约资料后，将自动打开 WhatsApp 联系 SABAI GO。"
      data-th="กรอกข้อมูลการจองแล้ว ระบบจะเปิด WhatsApp เพื่อติดต่อ SABAI GO อัตโนมัติ">
      填写预约资料后，将自动打开 WhatsApp 联系 SABAI GO。
    </p>

  </section>


  <main class="container">

    <aside class="summary-card">

      <div class="profile-box">

        <div id="profilePhotoBox"></div>

        <div>

          <div
            id="profileName"
            class="profile-name">
          </div>

          <div
            id="profileArea"
            class="profile-area">
          </div>

        </div>

      </div>


      <div class="summary-line">

        <span
          class="summary-label"
          data-zh="每小时"
          data-th="ต่อชั่วโมง">
          每小时
        </span>

        <span
          id="hourlyPrice"
          class="summary-value">
        </span>

      </div>


      <div class="summary-line">

        <span
          class="summary-label"
          data-zh="最低预约"
          data-th="ขั้นต่ำ">
          最低预约
        </span>

        <span
          id="minimumHours"
          class="summary-value">
        </span>

      </div>


      <div class="summary-line">

        <span
          class="summary-label"
          data-zh="预约时长"
          data-th="จำนวนชั่วโมง">
          预约时长
        </span>

        <span
          id="selectedHours"
          class="summary-value">
          -
        </span>

      </div>


      <div class="total-box">

        <div
          class="total-label"
          data-zh="预计金额"
          data-th="ยอดประมาณการ">
          预计金额
        </div>

        <div
          id="totalPrice"
          class="total-price">
          RM0
        </div>

      </div>

    </aside>


    <section class="form-card">

      <h2
        data-zh="预约资料"
        data-th="รายละเอียดการจอง">
        预约资料
      </h2>


      <form id="bookingForm">

        <div class="form-grid">


          <div class="field">

            <label
              for="bookingDate"
              data-zh="预约日期"
              data-th="วันที่">
              预约日期
            </label>

            <input
              id="bookingDate"
              type="date"
              required>

          </div>


          <div class="field">

            <label
              for="bookingTime"
              data-zh="开始时间"
              data-th="เวลาเริ่ม">
              开始时间
            </label>

            <input
              id="bookingTime"
              type="time"
              required>

          </div>


          <div class="field">

            <label
              for="hours"
              data-zh="预约小时数"
              data-th="จำนวนชั่วโมง">
              预约小时数
            </label>

            <select
              id="hours"
              required
              onchange="calculateTotal()">
            </select>

          </div>


          <div class="field">

            <label
              for="area"
              data-zh="地区"
              data-th="พื้นที่">
              地区
            </label>

            <select
              id="area"
              required>

              <option value="Kuala Lumpur">
                Kuala Lumpur
              </option>

              <option value="Puchong">
                Puchong
              </option>

              <option value="Petaling Jaya">
                Petaling Jaya
              </option>

              <option value="Subang Jaya">
                Subang Jaya
              </option>

              <option value="Klang">
                Klang
              </option>

            </select>

          </div>


          <div class="field full">

            <label
              for="meetingPlace"
              data-zh="见面地点 / 场所"
              data-th="สถานที่นัดพบ">
              见面地点 / 场所
            </label>

            <input
              id="meetingPlace"
              type="text"
              required
              data-placeholder-zh="例如：Pavilion KL、KTV 店名、餐厅名称"
              data-placeholder-th="เช่น Pavilion KL, ชื่อ KTV หรือชื่อร้านอาหาร">

          </div>


          <div class="field">

            <label
              for="customerName"
              data-zh="你的名字"
              data-th="ชื่อของคุณ">
              你的名字
            </label>

            <input
              id="customerName"
              type="text"
              required>

          </div>


          <div class="field">

            <label
              for="phone"
              data-zh="电话号码 / WhatsApp"
              data-th="เบอร์โทร / WhatsApp">
              电话号码 / WhatsApp
            </label>

            <input
              id="phone"
              type="tel"
              required
              placeholder="01X-XXXXXXX">

          </div>


          <div class="field full">

            <label
              for="notes"
              data-zh="备注"
              data-th="หมายเหตุ">
              备注
            </label>

            <textarea
              id="notes"
              data-placeholder-zh="可以填写活动类型、人数、KTV / 酒吧名称或其他要求。"
              data-placeholder-th="สามารถระบุประเภทกิจกรรม จำนวนคน ชื่อ KTV / บาร์ หรือรายละเอียดเพิ่มเติมได้">
            </textarea>

          </div>

        </div>


        <div
          class="booking-note"
          data-zh="点击提交后，会自动打开 WhatsApp。预约需要由 SABAI GO 确认时间与安排后才算成功。"
          data-th="หลังจากกดส่ง ระบบจะเปิด WhatsApp อัตโนมัติ การจองจะสมบูรณ์เมื่อ SABAI GO ยืนยันเวลาและรายละเอียดแล้ว">
          点击提交后，会自动打开 WhatsApp。预约需要由 SABAI GO 确认时间与安排后才算成功。
        </div>


        <button
          type="submit"
          class="submit-btn"
          data-zh="WhatsApp 提交预约"
          data-th="ส่งคำขอผ่าน WhatsApp">
          WhatsApp 提交预约
        </button>


        <div
          id="message"
          class="message">
        </div>

      </form>

    </section>

  </main>

</div>


<div
  id="notFound"
  class="not-found">

  <h2
    data-zh="找不到这个人物资料"
    data-th="ไม่พบโปรไฟล์นี้">
    找不到这个人物资料
  </h2>

  <br>

  <a
    href="companions.html"
    style="color:#ff4eb3;"
    data-zh="返回人物列表"
    data-th="กลับไปหน้ารายการ">
    返回人物列表
  </a>

</div>


<footer>
  © 2026 SABAI GO
</footer>


<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://xfezhdqakmyecregqesn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_AuNzm5CWOK2B2Pa7Pn_wBA_pAqHVpI2";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     WHATSAPP
  ========================================= */

  const WHATSAPP_NUMBER =
    "601163803627";


  let profile = null;


  let currentLanguage =
    localStorage.getItem(
      "sabaigo-language"
    ) || "zh";


  const params =
    new URLSearchParams(
      window.location.search
    );


  const slug =
    params.get("id");


  /* =========================================
     LOAD PROFILE
  ========================================= */

  async function loadProfile() {

    if (!slug) {

      showNotFound();

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("companions")
        .select("*")
        .eq(
          "slug",
          slug
        )
        .eq(
          "is_published",
          true
        )
        .maybeSingle();


    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


    if (
      error ||
      !data
    ) {

      console.error(
        error
      );

      showNotFound();

      return;

    }


    profile =
      data;


    document
      .getElementById(
        "bookingPage"
      )
      .style.display =
        "block";


    initializePage();

  }


  /* =========================================
     PAGE
  ========================================= */

  function initializePage() {

    if (!profile) {
      return;
    }


    const photoBox =
      document
        .getElementById(
          "profilePhotoBox"
        );


    if (
      profile.cover_image
    ) {

      photoBox.innerHTML = `
        <img
          class="profile-photo"
          src="${escapeHtml(profile.cover_image)}"
          alt="${escapeHtml(profile.nickname || "")}">
      `;

    }
    else {

      photoBox.innerHTML = `
        <div class="profile-placeholder">
          No Image
        </div>
      `;

    }


    document
      .getElementById(
        "profileName"
      )
      .textContent =
        profile.nickname ||
        "-";


    document
      .getElementById(
        "profileArea"
      )
      .textContent =
        "📍 " +
        (
          profile.area ||
          "-"
        );


    document
      .getElementById(
        "hourlyPrice"
      )
      .textContent =
        "RM" +
        (
          profile.price_per_hour ??
          0
        );


    document
      .getElementById(
        "area"
      )
      .value =
        profile.area ||
        "Kuala Lumpur";


    document
      .getElementById(
        "backLink"
      )
      .href =
        "companion-detail.html?id=" +
        encodeURIComponent(
          profile.slug
        );


    createHourOptions();

    setMinimumDate();

    setLanguage(
      currentLanguage
    );

    calculateTotal();

  }


  /* =========================================
     HOURS
  ========================================= */

  function createHourOptions() {

    if (!profile) {
      return;
    }


    const select =
      document
        .getElementById(
          "hours"
        );


    select.innerHTML =
      "";


    const minimum =
      Number(
        profile.minimum_hours
      ) || 1;


    for (
      let i = minimum;
      i <= 12;
      i++
    ) {

      const option =
        document
          .createElement(
            "option"
          );


      option.value =
        i;


      option.textContent =
        currentLanguage === "zh"
          ? i + " 小时"
          : i + " ชั่วโมง";


      select.appendChild(
        option
      );

    }

  }


  /* =========================================
     DATE
  ========================================= */

  function setMinimumDate() {

    const today =
      new Date();


    const year =
      today.getFullYear();


    const month =
      String(
        today.getMonth() + 1
      ).padStart(
        2,
        "0"
      );


    const day =
      String(
        today.getDate()
      ).padStart(
        2,
        "0"
      );


    document
      .getElementById(
        "bookingDate"
      )
      .min =
        year +
        "-" +
        month +
        "-" +
        day;

  }


  /* =========================================
     TOTAL
  ========================================= */

  function calculateTotal() {

    if (!profile) {
      return;
    }


    const hours =
      Number(
        document
          .getElementById(
            "hours"
          )
          .value
      );


    const price =
      Number(
        profile.price_per_hour
      ) || 0;


    const total =
      hours *
      price;


    document
      .getElementById(
        "selectedHours"
      )
      .textContent =
        hours
          ? (
              currentLanguage === "zh"
                ? hours + " 小时"
                : hours + " ชั่วโมง"
            )
          : "-";


    document
      .getElementById(
        "totalPrice"
      )
      .textContent =
        "RM" + total;

  }


  /* =========================================
     LANGUAGE
  ========================================= */

  function setLanguage(
    lang
  ) {

    currentLanguage =
      lang;


    localStorage.setItem(
      "sabaigo-language",
      lang
    );


    document
      .querySelectorAll(
        "[data-zh]"
      )
      .forEach(
        function(el) {

          const value =
            el.getAttribute(
              "data-" + lang
            );


          if (
            value !== null
          ) {

            el.textContent =
              value;

          }

        }
      );


    document
      .querySelectorAll(
        "[data-placeholder-zh]"
      )
      .forEach(
        function(el) {

          const value =
            el.getAttribute(
              "data-placeholder-" +
              lang
            );


          if (
            value !== null
          ) {

            el.placeholder =
              value;

          }

        }
      );


    document
      .getElementById(
        "zhBtn"
      )
      .classList
      .toggle(
        "active",
        lang === "zh"
      );


    document
      .getElementById(
        "thBtn"
      )
      .classList
      .toggle(
        "active",
        lang === "th"
      );


    document.documentElement.lang =
      lang === "zh"
        ? "zh"
        : "th";


    if (
      profile
    ) {

      document
        .getElementById(
          "minimumHours"
        )
        .textContent =
          lang === "zh"
            ? (
                profile.minimum_hours ||
                0
              ) +
              " 小时"
            : (
                profile.minimum_hours ||
                0
              ) +
              " ชั่วโมง";


      createHourOptions();

      calculateTotal();

    }

  }


  /* =========================================
     WHATSAPP SUBMIT
  ========================================= */

  document
    .getElementById(
      "bookingForm"
    )
    .addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        if (!profile) {
          return;
        }


        const date =
          document
            .getElementById(
              "bookingDate"
            )
            .value;


        const time =
          document
            .getElementById(
              "bookingTime"
            )
            .value;


        const hours =
          Number(
            document
              .getElementById(
                "hours"
              )
              .value
          );


        const area =
          document
            .getElementById(
              "area"
            )
            .value;


        const meetingPlace =
          document
            .getElementById(
              "meetingPlace"
            )
            .value
            .trim();


        const customerName =
          document
            .getElementById(
              "customerName"
            )
            .value
            .trim();


        const phone =
          document
            .getElementById(
              "phone"
            )
            .value
            .trim();


        const notes =
          document
            .getElementById(
              "notes"
            )
            .value
            .trim();


        const messageBox =
          document
            .getElementById(
              "message"
            );


        if (
          !date ||
          !time ||
          !hours ||
          !area ||
          !meetingPlace ||
          !customerName ||
          !phone
        ) {

          messageBox.className =
            "message error";


          messageBox.textContent =
            currentLanguage === "zh"
              ? "请填写所有必填资料。"
              : "กรุณากรอกข้อมูลที่จำเป็นให้ครบ";


          return;

        }


        const hourlyPrice =
          Number(
            profile.price_per_hour
          ) || 0;


        const total =
          hourlyPrice *
          hours;


        let whatsappMessage;


        if (
          currentLanguage === "zh"
        ) {

          whatsappMessage =
`SABAI GO 预约申请

人物：${profile.nickname}
编号：${profile.slug}

日期：${date}
开始时间：${time}
预约时长：${hours} 小时

地区：${area}
见面地点：${meetingPlace}

每小时：RM${hourlyPrice}
预计金额：RM${total}

客户姓名：${customerName}
客户电话：${phone}

备注：${notes || "-"}

请帮我确认这个预约，谢谢。`;

        }
        else {

          whatsappMessage =
`คำขอจอง SABAI GO

โปรไฟล์: ${profile.nickname}
รหัส: ${profile.slug}

วันที่: ${date}
เวลาเริ่ม: ${time}
จำนวน: ${hours} ชั่วโมง

พื้นที่: ${area}
สถานที่นัดพบ: ${meetingPlace}

ราคาต่อชั่วโมง: RM${hourlyPrice}
ยอดประมาณการ: RM${total}

ชื่อลูกค้า: ${customerName}
เบอร์โทร: ${phone}

หมายเหตุ: ${notes || "-"}

กรุณาช่วยยืนยันการจอง ขอบคุณครับ/ค่ะ`;

        }


        const whatsappUrl =
          "https://wa.me/" +
          WHATSAPP_NUMBER +
          "?text=" +
          encodeURIComponent(
            whatsappMessage
          );


        window.location.href =
          whatsappUrl;

      }
    );


  /* =========================================
     NOT FOUND
  ========================================= */

  function showNotFound() {

    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "bookingPage"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "notFound"
      )
      .style.display =
        "block";

  }


  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  setLanguage(
    currentLanguage
  );


  loadProfile();

</script>

</body>
</html>
