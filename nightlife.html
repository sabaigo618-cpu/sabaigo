<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SABAI GO - Nightlife</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px 6%;

      background: rgba(0,0,0,.94);
      border-bottom: 1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 29px;
      font-weight: 900;
    }

    .logo span {
      color: #ff2ea6;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .home-link {
      color: #ccc;
      font-size: 14px;
    }

    .lang-btn {
      border: 1px solid #ff2ea6;
      background: transparent;
      color: white;

      padding: 7px 13px;
      border-radius: 20px;

      cursor: pointer;
    }

    .lang-btn.active {
      background: #ff2ea6;
    }

    .hero {
      text-align: center;

      padding: 65px 20px 45px;

      background:
        radial-gradient(
          circle at top,
          rgba(139,60,255,.30),
          transparent 40%
        ),
        radial-gradient(
          circle at right,
          rgba(255,46,166,.18),
          transparent 35%
        );
    }

    .small-title {
      color: #ff58b9;

      font-size: 13px;
      letter-spacing: 3px;

      margin-bottom: 13px;
    }

    .hero h1 {
      font-size: 43px;
      margin-bottom: 14px;
    }

    .hero p {
      color: #aaa;

      font-size: 15px;
      line-height: 1.7;
    }

    .filters {
      max-width: 1200px;

      margin: 28px auto 30px;

      padding: 0 20px;
    }

    .filter-box {
      background: #0d0d0d;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 18px;

      padding: 18px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 12px;
    }

    .filter-box select,
    .filter-box input {
      width: 100%;

      background: #171717;

      border: 1px solid #2b2b2b;

      color: white;

      border-radius: 10px;

      padding: 12px;

      outline: none;
    }

    .result-info {
      max-width: 1200px;

      margin: auto;

      padding: 0 20px 16px;

      color: #888;

      font-size: 14px;
    }

    .cards {
      max-width: 1200px;

      margin: auto;

      padding: 0 20px 70px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 22px;
    }

    .card {
      background: #101010;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 18px;

      overflow: hidden;

      transition: .25s;
    }

    .card:hover {
      transform: translateY(-6px);

      border-color: rgba(255,46,166,.42);

      box-shadow:
        0 18px 45px rgba(255,46,166,.10);
    }

    .photo-wrap {
      position: relative;

      aspect-ratio: 4 / 3;

      background:
        linear-gradient(
          135deg,
          #25102c,
          #111
        );

      overflow: hidden;
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .type-badge {
      position: absolute;

      top: 12px;
      right: 12px;

      padding: 7px 11px;

      border-radius: 18px;

      background: rgba(0,0,0,.75);

      border: 1px solid rgba(255,255,255,.15);

      color: #ff67be;

      font-size: 12px;
      font-weight: bold;
    }

    .status {
      position: absolute;

      top: 12px;
      left: 12px;

      padding: 7px 11px;

      border-radius: 18px;

      font-size: 12px;
      font-weight: bold;
    }

    .available {
      background: rgba(24,180,100,.92);
    }

    .off {
      background: rgba(90,90,90,.92);
    }

    .card-body {
      padding: 18px;
    }

    .name {
      font-size: 22px;
      font-weight: bold;

      margin-bottom: 9px;
    }

    .location {
      color: #aaa;

      font-size: 13px;

      margin-bottom: 8px;
    }

    .address {
      color: #777;

      font-size: 12px;

      line-height: 1.5;

      margin-bottom: 12px;
    }

    .hours {
      color: #bbb;

      font-size: 13px;

      margin-bottom: 12px;
    }

    .price-range {
      margin-top: 12px;

      padding: 13px;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          rgba(139,60,255,.15),
          rgba(255,46,166,.10)
        );

      color: #ff57b9;

      font-weight: bold;
    }

    .view-btn {
      display: block;

      width: 100%;

      margin-top: 15px;

      padding: 11px;

      border-radius: 9px;

      text-align: center;

      background:
        linear-gradient(
          90deg,
          #873cff,
          #ff2ea6
        );

      font-weight: bold;

      font-size: 13px;
    }

    .loading,
    .empty {
      max-width: 1200px;

      margin: auto;

      padding: 60px 20px 90px;

      text-align: center;

      color: #777;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,.07);

      padding: 28px 20px;

      text-align: center;

      color: #666;

      font-size: 12px;
    }

    @media(max-width:1000px) {

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .filter-box {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media(max-width:650px) {

      .topbar {
        padding: 13px 15px;
      }

      .logo {
        font-size: 23px;
      }

      .home-link {
        display: none;
      }

      .hero {
        padding-top: 45px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .cards {
        grid-template-columns: 1fr;

        padding-left: 13px;
        padding-right: 13px;
      }

      .filters {
        padding: 0 13px;
      }

      .filter-box {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

<header class="topbar">

  <a
    href="index.html"
    class="logo">
    SABAI <span>GO</span>
  </a>

  <div class="top-right">

    <a
      href="index.html"
      class="home-link"
      data-zh="首页"
      data-th="หน้าหลัก">
      首页
    </a>

    <button
      id="zhBtn"
      class="lang-btn active"
      onclick="setLanguage('zh')">
      中文
    </button>

    <button
      id="thBtn"
      class="lang-btn"
      onclick="setLanguage('th')">
      ไทย
    </button>

  </div>

</header>


<section class="hero">

  <div class="small-title">
    SABAI GO NIGHTLIFE
  </div>

  <h1
    data-zh="今晚去哪里？"
    data-th="คืนนี้ไปไหนดี?">
    今晚去哪里？
  </h1>

  <p
    data-zh="浏览 KTV、Pub、Bar、Club 与 Lounge，查看地址、营业时间和消费范围。"
    data-th="ค้นหา KTV, Pub, Bar, Club และ Lounge พร้อมดูที่อยู่ เวลาเปิด และช่วงราคา">
    浏览 KTV、Pub、Bar、Club 与 Lounge，查看地址、营业时间和消费范围。
  </p>

</section>


<div class="filters">

  <div class="filter-box">

    <select
      id="typeFilter"
      onchange="renderCards()">

      <option
        value="all"
        data-zh="全部类型"
        data-th="ทุกประเภท">
        全部类型
      </option>

      <option value="ktv">
        KTV
      </option>

      <option value="pub">
        Pub
      </option>

      <option value="bar">
        Bar
      </option>

      <option value="club">
        Club
      </option>

      <option value="lounge">
        Lounge
      </option>

    </select>


    <select
      id="areaFilter"
      onchange="renderCards()">

      <option
        value="all"
        data-zh="全部地区"
        data-th="ทุกพื้นที่">
        全部地区
      </option>

      <option value="Kuala Lumpur">
        Kuala Lumpur
      </option>

      <option value="Puchong">
        Puchong
      </option>

      <option value="Petaling Jaya">
        Petaling Jaya
      </option>

      <option value="Subang Jaya">
        Subang Jaya
      </option>

      <option value="Klang">
        Klang
      </option>

      <option value="Shah Alam">
        Shah Alam
      </option>

      <option value="Setia Alam">
        Setia Alam
      </option>

    </select>


    <input
      id="searchInput"
      type="text"
      oninput="renderCards()"
      data-placeholder-zh="搜索店名 / 地址..."
      data-placeholder-th="ค้นหาชื่อร้าน / ที่อยู่...">

  </div>

</div>


<div class="result-info">

  <span
    data-zh="找到"
    data-th="พบ">
    找到
  </span>

  <strong id="resultCount">
    0
  </strong>

  <span
    data-zh="个场所"
    data-th="สถานที่">
    个场所
  </span>

</div>


<div
  id="loading"
  class="loading">
  Loading...
</div>


<main
  id="cards"
  class="cards"
  style="display:none;">
</main>


<div
  id="empty"
  class="empty"
  style="display:none;">

  <h2
    data-zh="暂时没有符合条件的场所"
    data-th="ยังไม่มีสถานที่ที่ตรงกับเงื่อนไข">
    暂时没有符合条件的场所
  </h2>

</div>


<footer>
  © 2026 SABAI GO
</footer>


<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://xfezhdqakmyecregqesn.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_AuNzm5CWOK2B2Pa7Pn_wBA_pAqHVpI2";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let venues = [];


  let currentLanguage =
    localStorage.getItem(
      "sabaigo-language"
    ) || "zh";


  /* =========================================
     READ URL TYPE
  ========================================= */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const urlType =
    params.get("type");


  /* =========================================
     LOAD
  ========================================= */

  async function loadVenues() {

    document
      .getElementById(
        "loading"
      )
      .style.display =
        "block";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("venues")
        .select("*")
        .eq(
          "is_published",
          true
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    document
      .getElementById(
        "loading"
      )
      .style.display =
        "none";


    if (
      error
    ) {

      console.error(
        error
      );


      document
        .getElementById(
          "empty"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "empty"
        )
        .innerHTML =
          currentLanguage === "zh"
            ? "<h2>暂时无法读取娱乐场所资料</h2>"
            : "<h2>ไม่สามารถโหลดข้อมูลสถานบันเทิงได้</h2>";


      return;

    }


    venues =
      data || [];


    if (
      urlType &&
      [
        "ktv",
        "pub",
        "bar",
        "club",
        "lounge"
      ].includes(urlType)
    ) {

      document
        .getElementById(
          "typeFilter"
        )
        .value =
          urlType;

    }


    renderCards();

  }


  /* =========================================
     RENDER
  ========================================= */

  function renderCards() {

    const cards =
      document
        .getElementById(
          "cards"
        );


    const empty =
      document
        .getElementById(
          "empty"
        );


    const type =
      document
        .getElementById(
          "typeFilter"
        )
        .value;


    const area =
      document
        .getElementById(
          "areaFilter"
        )
        .value;


    const search =
      document
        .getElementById(
          "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const filtered =
      venues.filter(
        function(item) {

          const typeMatch =
            type === "all" ||
            item.type === type;


          const areaMatch =
            area === "all" ||
            item.area === area;


          const searchable =
            (
              (item.name || "") +
              " " +
              (item.address || "") +
              " " +
              (item.area || "")
            )
            .toLowerCase();


          const searchMatch =
            !search ||
            searchable.includes(
              search
            );


          return (
            typeMatch &&
            areaMatch &&
            searchMatch
          );

        }
      );


    document
      .getElementById(
        "resultCount"
      )
      .textContent =
        filtered.length;


    cards.innerHTML =
      "";


    if (
      filtered.length === 0
    ) {

      cards.style.display =
        "none";


      empty.style.display =
        "block";


      empty.innerHTML =
        currentLanguage === "zh"
          ? "<h2>暂时没有符合条件的场所</h2>"
          : "<h2>ยังไม่มีสถานที่ที่ตรงกับเงื่อนไข</h2>";


      return;

    }


    empty.style.display =
      "none";


    cards.style.display =
      "grid";


    filtered.forEach(
      function(item) {

        const card =
          document.createElement(
            "article"
          );


        card.className =
          "card";


        card.innerHTML = `

          <div class="photo-wrap">

            ${
              item.cover_image
                ? `
                  <img
                    src="${escapeHtml(item.cover_image)}"
                    alt="${escapeHtml(item.name || "")}">
                `
                : `
                  <div
                    style="
                      width:100%;
                      height:100%;
                      display:flex;
                      align-items:center;
                      justify-content:center;
                      color:#666;
                    ">
                    No Image
                  </div>
                `
            }


            <span
              class="status ${statusClass(item.status)}">

              ${statusText(item.status)}

            </span>


            <span class="type-badge">
              ${escapeHtml(typeText(item.type))}
            </span>

          </div>


          <div class="card-body">

            <div class="name">
              ${escapeHtml(item.name || "-")}
            </div>


            <div class="location">
              📍 ${escapeHtml(item.area || "-")}
            </div>


            <div class="address">
              ${escapeHtml(item.address || "-")}
            </div>


            <div class="hours">

              🕒
              ${
                escapeHtml(
                  item.opening_hours ||
                  "-"
                )
              }

            </div>


            <div class="price-range">

              ${
                currentLanguage === "zh"
                  ? "消费范围："
                  : "ช่วงราคา: "
              }

              ${escapeHtml(item.price_range || "-")}

            </div>


            <a
              href="nightlife-detail.html?id=${encodeURIComponent(item.slug)}"
              class="view-btn">

              ${
                currentLanguage === "zh"
                  ? "查看详情"
                  : "ดูรายละเอียด"
              }

            </a>

          </div>

        `;


        cards.appendChild(
          card
        );

      }
    );

  }


  /* =========================================
     TYPE
  ========================================= */

  function typeText(
    value
  ) {

    const map = {

      ktv:
        "KTV",

      pub:
        "Pub",

      bar:
        "Bar",

      club:
        "Club",

      lounge:
        "Lounge"

    };


    return map[value] ||
      value ||
      "-";

  }


  /* =========================================
     STATUS
  ========================================= */

  function statusClass(
    value
  ) {

    return value ===
      "available"
        ? "available"
        : "off";

  }


  function statusText(
    value
  ) {

    if (
      value ===
      "available"
    ) {

      return currentLanguage === "zh"
        ? "● Available"
        : "● เปิด";

    }


    return currentLanguage === "zh"
      ? "● Off"
      : "● ปิด";

  }


  /* =========================================
     LANGUAGE
  ========================================= */

  function setLanguage(
    lang
  ) {

    currentLanguage =
      lang;


    localStorage.setItem(
      "sabaigo-language",
      lang
    );


    document
      .querySelectorAll(
        "[data-zh]"
      )
      .forEach(
        function(el) {

          const value =
            el.getAttribute(
              "data-" +
              lang
            );


          if (
            value !== null
          ) {

            el.textContent =
              value;

          }

        }
      );


    document
      .querySelectorAll(
        "[data-placeholder-zh]"
      )
      .forEach(
        function(el) {

          const value =
            el.getAttribute(
              "data-placeholder-" +
              lang
            );


          if (
            value !== null
          ) {

            el.placeholder =
              value;

          }

        }
      );


    document
      .getElementById(
        "zhBtn"
      )
      .classList
      .toggle(
        "active",
        lang === "zh"
      );


    document
      .getElementById(
        "thBtn"
      )
      .classList
      .toggle(
        "active",
        lang === "th"
      );


    renderCards();

  }


  /* =========================================
     SAFE HTML
  ========================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =========================================
     START
  ========================================= */

  setLanguage(
    currentLanguage
  );


  loadVenues();

</script>

</body>
</html>
