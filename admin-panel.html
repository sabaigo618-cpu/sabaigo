<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SABAI GO Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070707;
      color: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 15px 5%;

      background: rgba(0,0,0,.95);
      border-bottom: 1px solid rgba(255,255,255,.08);

      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
    }

    .logo span {
      color: #ff2ea6;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-btn,
    .logout-btn {
      border: 1px solid #ff2ea6;
      background: transparent;
      color: white;

      padding: 8px 13px;
      border-radius: 20px;
    }

    .lang-btn.active {
      background: #ff2ea6;
    }

    .logout-btn {
      border-color: #444;
    }

    /* =========================
       LAYOUT
    ========================= */

    .layout {
      display: grid;
      grid-template-columns: 230px 1fr;

      min-height: calc(100vh - 66px);
    }

    .sidebar {
      padding: 25px 15px;

      background: #0c0c0c;

      border-right: 1px solid rgba(255,255,255,.07);
    }

    .menu-title {
      color: #666;

      font-size: 11px;
      letter-spacing: 2px;

      margin: 0 10px 15px;
    }

    .menu-btn {
      display: block;

      width: 100%;

      border: none;
      background: transparent;

      color: #aaa;

      padding: 13px 14px;

      border-radius: 10px;

      text-align: left;

      margin-bottom: 7px;
    }

    .menu-btn:hover {
      color: white;
      background: #151515;
    }

    .menu-btn.active {
      background:
        linear-gradient(
          90deg,
          rgba(132,60,255,.28),
          rgba(255,46,166,.20)
        );

      color: white;
    }

    .main {
      padding: 30px;
    }

    /* =========================
       PAGE HEADER
    ========================= */

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 25px;
    }

    .page-head h1 {
      font-size: 30px;
    }

    .page-head p {
      color: #888;

      margin-top: 6px;

      font-size: 13px;
    }

    .primary-btn {
      border: none;

      color: #fff;

      background:
        linear-gradient(
          90deg,
          #843cff,
          #ff2ea6
        );

      padding: 11px 17px;

      border-radius: 10px;

      font-weight: bold;
    }

    .primary-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

      gap: 15px;

      margin-bottom: 25px;
    }

    .stat {
      background: #101010;

      border: 1px solid rgba(255,255,255,.07);

      border-radius: 16px;

      padding: 20px;
    }

    .stat-label {
      color: #777;

      font-size: 12px;

      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 27px;
      font-weight: bold;
    }

    /* =========================
       FILTER
    ========================= */

    .toolbar {
      display: flex;
      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 18px;
    }

    .toolbar input,
    .toolbar select {
      background: #151515;

      color: white;

      border: 1px solid #2b2b2b;

      border-radius: 10px;

      padding: 11px 12px;

      outline: none;
    }

    .toolbar input {
      min-width: 240px;
    }

    /* =========================
       TABLE
    ========================= */

    .table-wrap {
      overflow-x: auto;

      background: #0f0f0f;

      border: 1px solid rgba(255,255,255,.07);

      border-radius: 16px;
    }

    table {
      width: 100%;
      min-width: 1150px;

      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px;

      text-align: left;

      border-bottom: 1px solid rgba(255,255,255,.06);

      font-size: 13px;
    }

    th {
      color: #777;

      font-weight: normal;

      background: #121212;
    }

    .thumb {
      width: 55px;
      height: 68px;

      object-fit: cover;

      border-radius: 9px;

      background: #1b1b1b;
    }

    .badge {
      display: inline-block;

      padding: 6px 9px;

      border-radius: 14px;

      font-size: 11px;
    }

    .available {
      background: rgba(30,180,100,.16);
      color: #80e8aa;
    }

    .busy {
      background: rgba(240,160,30,.16);
      color: #f6c36e;
    }

    .off {
      background: rgba(120,120,120,.16);
      color: #aaa;
    }

    .published {
      color: #7deba8;
    }

    .hidden {
      color: #999;
    }

    .price {
      color: #ff52b7;

      font-weight: bold;
    }

    .action-btn {
      border: 1px solid #333;

      background: #171717;

      color: #ddd;

      padding: 7px 9px;

      border-radius: 8px;

      margin-right: 5px;
      margin-bottom: 5px;
    }

    .action-btn:hover {
      border-color: #666;
    }

    .danger {
      border-color: rgba(220,60,80,.45);
      color: #ff8798;
    }

    .empty {
      padding: 50px;

      text-align: center;

      color: #777;
    }

    .loading {
      padding: 40px;

      text-align: center;

      color: #999;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 2000;

      background: rgba(0,0,0,.82);

      padding: 25px;

      overflow-y: auto;
    }

    .modal.show {
      display: block;
    }

    .modal-box {
      max-width: 900px;

      margin: 30px auto;

      background: #0f0f0f;

      border: 1px solid rgba(255,255,255,.10);

      border-radius: 20px;

      padding: 25px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 22px;
    }

    .close-btn {
      border: none;

      background: transparent;

      color: #aaa;

      font-size: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;

      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: #999;

      font-size: 12px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;

      background: #171717;

      border: 1px solid #2e2e2e;

      color: white;

      border-radius: 9px;

      padding: 12px;

      outline: none;
    }

    .field textarea {
      min-height: 100px;

      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #ff2ea6;
    }

    .preview {
      margin-top: 10px;

      width: 130px;
      height: 165px;

      object-fit: cover;

      border-radius: 12px;

      background: #1a1a1a;

      display: none;
    }

    /* =========================
       GALLERY
    ========================= */

    .gallery-title {
      margin-top: 15px;
      margin-bottom: 10px;

      color: #aaa;

      font-size: 12px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);

      gap: 10px;

      margin-top: 10px;
    }

    .gallery-item {
      position: relative;

      aspect-ratio: 4 / 5;

      overflow: hidden;

      background: #151515;

      border: 1px solid #292929;

      border-radius: 10px;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .gallery-delete {
      position: absolute;

      top: 6px;
      right: 6px;

      width: 28px;
      height: 28px;

      border: none;

      border-radius: 50%;

      background: rgba(0,0,0,.82);

      color: #ff8191;

      font-weight: bold;
    }

    .selected-images {
      margin-top: 9px;

      color: #999;

      font-size: 12px;
    }

    /* =========================
       FORM ACTION
    ========================= */

    .form-actions {
      margin-top: 22px;

      display: flex;
      justify-content: flex-end;

      gap: 10px;
    }

    .secondary-btn {
      background: #191919;

      border: 1px solid #333;

      color: white;

      padding: 11px 16px;

      border-radius: 9px;
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 13px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.6;
    }

    .message.error {
      display: block;

      color: #ff9aaa;

      border: 1px solid rgba(220,60,80,.35);

      background: rgba(220,60,80,.10);
    }

    .message.success {
      display: block;

      color: #91efb7;

      border: 1px solid rgba(30,180,100,.35);

      background: rgba(30,180,100,.10);
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:900px) {

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media(max-width:600px) {

      .main {
        padding: 18px 13px;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .topbar {
        padding: 12px 14px;
      }

      .logo {
        font-size: 22px;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>


<!-- =========================
     TOPBAR
========================= -->

<header class="topbar">

  <div class="logo">
    SABAI <span>GO</span>
  </div>

  <div class="top-right">

    <button
      id="zhBtn"
      class="lang-btn active"
      onclick="setLanguage('zh')">
      中文
    </button>

    <button
      id="thBtn"
      class="lang-btn"
      onclick="setLanguage('th')">
      ไทย
    </button>

    <button
      class="logout-btn"
      onclick="logout()"
      data-zh="登出"
      data-th="ออกจากระบบ">
      登出
    </button>

  </div>

</header>


<div class="layout">


  <!-- =========================
       SIDEBAR
  ========================= -->

  <aside class="sidebar">

    <div class="menu-title">
      ADMIN
    </div>

    <a
      href="admin-panel.html"
      class="menu-btn active"
      data-zh="👤 Party Girl 管理"
      data-th="👤 จัดการ Party Girl">
      👤 Party Girl 管理
    </a>

    <a
      href="admin-spa.html"
      class="menu-btn"
      data-zh="💆 Massage & SPA"
      data-th="💆 Massage & SPA">
      💆 Massage & SPA
    </a>

    <a
      href="admin-venues.html"
      class="menu-btn"
      data-zh="🎤 KTV / Club"
      data-th="🎤 KTV / Club">
      🎤 KTV / Club
    </a>

    <a
      href="admin-water.html"
      class="menu-btn"
      data-zh="🌊 下水运动服务"
      data-th="🌊 บริการกิจกรรมทางน้ำ">
      🌊 下水运动服务
    </a>

  </aside>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="main">

    <div class="page-head">

      <div>

        <h1
          data-zh="Party Girl 管理"
          data-th="จัดการ Party Girl">
          Party Girl 管理
        </h1>

        <p
          data-zh="新增、编辑、价格、状态、封面、多张照片与上下架"
          data-th="เพิ่ม แก้ไข ราคา สถานะ รูปหน้าปก รูปเพิ่มเติม และการแสดงผล">
          新增、编辑、价格、状态、封面、多张照片与上下架
        </p>

      </div>

      <button
        class="primary-btn"
        onclick="openAddModal()"
        data-zh="+ 新增 Party Girl"
        data-th="+ เพิ่ม Party Girl">
        + 新增 Party Girl
      </button>

    </div>


    <!-- =========================
         STATS
    ========================= -->

    <section class="stats">

      <div class="stat">

        <div
          class="stat-label"
          data-zh="总人物"
          data-th="ทั้งหมด">
          总人物
        </div>

        <div
          class="stat-value"
          id="totalCount">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Available
        </div>

        <div
          class="stat-value"
          id="availableCount">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Busy
        </div>

        <div
          class="stat-value"
          id="busyCount">
          0
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-label"
          data-zh="已发布"
          data-th="เผยแพร่แล้ว">
          已发布
        </div>

        <div
          class="stat-value"
          id="publishedCount">
          0
        </div>

      </div>

    </section>


    <!-- =========================
         FILTER
    ========================= -->

    <div class="toolbar">

      <input
        id="searchInput"
        type="text"
        oninput="renderTable()"
        data-placeholder-zh="搜索昵称 / 地区..."
        data-placeholder-th="ค้นหาชื่อ / พื้นที่...">

      <select
        id="statusFilter"
        onchange="renderTable()">

        <option
          value="all"
          data-zh="全部状态"
          data-th="ทุกสถานะ">
          全部状态
        </option>

        <option value="available">
          Available
        </option>

        <option value="busy">
          Busy
        </option>

        <option value="off">
          Off
        </option>

      </select>

    </div>


    <!-- =========================
         TABLE
    ========================= -->

    <div class="table-wrap">

      <div
        id="loading"
        class="loading">
        Loading...
      </div>


      <table
        id="dataTable"
        style="display:none;">

        <thead>

          <tr>

            <th
              data-zh="照片"
              data-th="รูป">
              照片
            </th>

            <th
              data-zh="昵称"
              data-th="ชื่อ">
              昵称
            </th>

            <th
              data-zh="地区"
              data-th="พื้นที่">
              地区
            </th>

            <th
              data-zh="类型"
              data-th="ประเภท">
              类型
            </th>

            <th
              data-zh="价格"
              data-th="ราคา">
              价格
            </th>

            <th
              data-zh="多图"
              data-th="รูปเพิ่มเติม">
              多图
            </th>

            <th
              data-zh="状态"
              data-th="สถานะ">
              状态
            </th>

            <th
              data-zh="发布"
              data-th="เผยแพร่">
              发布
            </th>

            <th
              data-zh="操作"
              data-th="จัดการ">
              操作
            </th>

          </tr>

        </thead>

        <tbody id="tableBody"></tbody>

      </table>


      <div
        id="emptyState"
        class="empty"
        style="display:none;">
      </div>

    </div>

  </main>

</div>


<!-- =========================
     ADD / EDIT MODAL
========================= -->

<div
  class="modal"
  id="profileModal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        新增 Party Girl
      </h2>

      <button
        type="button"
        class="close-btn"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <form id="profileForm">

      <input
        type="hidden"
        id="editId">

      <input
        type="hidden"
        id="existingImage">


      <div class="form-grid">


        <!-- SLUG -->

        <div class="field">

          <label>
            Slug
          </label>

          <input
            id="slug"
            type="text"
            required
            placeholder="may">

        </div>


        <!-- NICKNAME -->

        <div class="field">

          <label
            data-zh="昵称"
            data-th="ชื่อเล่น">
            昵称
          </label>

          <input
            id="nickname"
            type="text"
            required>

        </div>


        <!-- AGE -->

        <div class="field">

          <label
            data-zh="年龄"
            data-th="อายุ">
            年龄
          </label>

          <input
            id="age"
            type="number"
            min="18"
            max="99"
            required>

        </div>


        <!-- GENDER -->

        <div class="field">

          <label
            data-zh="性别"
            data-th="เพศ">
            性别
          </label>

          <select
            id="gender"
            required>

            <option
              value="female"
              data-zh="女生"
              data-th="ผู้หญิง">
              女生
            </option>

            <option
              value="male"
              data-zh="男生"
              data-th="ผู้ชาย">
              男生
            </option>

          </select>

        </div>


        <!-- AREA -->

        <div class="field">

          <label
            data-zh="地区"
            data-th="พื้นที่">
            地区
          </label>

          <select
            id="area"
            required>

            <option value="Kuala Lumpur">
              Kuala Lumpur
            </option>

            <option value="Puchong">
              Puchong
            </option>

            <option value="Petaling Jaya">
              Petaling Jaya
            </option>

            <option value="Subang Jaya">
              Subang Jaya
            </option>

            <option value="Klang">
              Klang
            </option>

            <option value="Shah Alam">
              Shah Alam
            </option>

            <option value="Setia Alam">
              Setia Alam
            </option>

          </select>

        </div>


        <!-- SERVICE TYPE -->

        <div class="field">

          <label
            data-zh="服务类型"
            data-th="ประเภทบริการ">
            服务类型
          </label>

          <select
            id="serviceType"
            required>

            <option value="party">
              Party Girl
            </option>

          </select>

        </div>


        <!-- LANGUAGES -->

        <div class="field">

          <label
            data-zh="语言"
            data-th="ภาษา">
            语言
          </label>

          <input
            id="languages"
            type="text"
            data-placeholder-zh="例如：泰语, 华语, 英语"
            data-placeholder-th="เช่น ไทย, จีน, อังกฤษ">

        </div>


        <!-- AVAILABLE TIME -->

        <div class="field">

          <label
            data-zh="可预约时间"
            data-th="เวลาที่รับจอง">
            可预约时间
          </label>

          <input
            id="availableTime"
            type="text"
            placeholder="7PM - 2AM">

        </div>


        <!-- PRICE -->

        <div class="field">

          <label
            data-zh="RM / 小时"
            data-th="RM / ชั่วโมง">
            RM / 小时
          </label>

          <input
            id="pricePerHour"
            type="number"
            min="0"
            step="1"
            required>

        </div>


        <!-- MIN HOURS -->

        <div class="field">

          <label
            data-zh="最低预约小时"
            data-th="ขั้นต่ำกี่ชั่วโมง">
            最低预约小时
          </label>

          <input
            id="minimumHours"
            type="number"
            min="1"
            max="24"
            value="3"
            required>

        </div>


        <!-- STATUS -->

        <div class="field">

          <label
            data-zh="状态"
            data-th="สถานะ">
            状态
          </label>

          <select id="status">

            <option value="available">
              Available
            </option>

            <option value="busy">
              Busy
            </option>

            <option value="off">
              Off
            </option>

          </select>

        </div>


        <!-- PUBLISH -->

        <div class="field">

          <label
            data-zh="前台显示"
            data-th="แสดงหน้าเว็บ">
            前台显示
          </label>

          <select id="isPublished">

            <option
              value="true"
              data-zh="发布"
              data-th="เผยแพร่">
              发布
            </option>

            <option
              value="false"
              data-zh="隐藏"
              data-th="ซ่อน">
              隐藏
            </option>

          </select>

        </div>


        <!-- SERVICES ZH -->

        <div class="field full">

          <label
            data-zh="中文服务"
            data-th="บริการภาษาจีน">
            中文服务
          </label>

          <input
            id="servicesZh"
            type="text"
            placeholder="陪喝酒,KTV,聚会,吃饭">

        </div>


        <!-- SERVICES TH -->

        <div class="field full">

          <label
            data-zh="泰语服务"
            data-th="บริการภาษาไทย">

  /* =========================================
     UPLOAD
  ========================================= */

  async function uploadStorageImage(
    file,
    folder,
    prefix
  ) {

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const path =
      folder +
      "/" +
      prefix +
      "-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2,8) +
      "." +
      extension;


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          BUCKET_NAME
        )
        .upload(
          path,
          file,
          {
            cacheControl:
              "3600",

            upsert:
              false
          }
        );


    if (
      error
    ) {

      throw error;

    }


    const {
      data
    } =
      supabaseClient
        .storage
        .from(
          BUCKET_NAME
        )
        .getPublicUrl(
          path
        );


    return {
      url:
        data.publicUrl,

      path:
        path
    };

  }


  /* =========================================
     STORAGE DELETE
  ========================================= */

  function getStoragePath(
    publicUrl
  ) {

    if (!publicUrl) {
      return null;
    }


    const marker =
      "/storage/v1/object/public/" +
      BUCKET_NAME +
      "/";


    const index =
      publicUrl.indexOf(
        marker
      );


    if (
      index === -1
    ) {

      return null;

    }


    return decodeURIComponent(
      publicUrl.substring(
        index +
        marker.length
      )
    );

  }


  async function removeStorageImage(
    publicUrl
  ) {

    const path =
      getStoragePath(
        publicUrl
      );


    if (!path) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          BUCKET_NAME
        )
        .remove([
          path
        ]);


    if (
      error
    ) {

      console.error(
        "Storage delete error:",
        error
      );

    }

  }


  /* =========================================

  ========================================= */

  function sanitizeSlug(value) {

    return String(
      value || ""
    )
      .toLowerCase()
      .trim()
      .replace(
        /\s+/g,
        "-"
      )
      .replace(
        /[^a-z0-9-]/g,
        ""
      )
      .replace(
        /-+/g,
        "-"
      )
      .replace(
        /^-|-$/g,
        ""
      );

  }


  async function checkSlug(
    slug,
    editId
  ) {

    let query =
      supabaseClient
        .from(
          "companions"
        )
        .select(
          "id"
        )
        .eq(
          "slug",
          slug
        );


    if (
      editId
    ) {

      query =
        query.neq(
          "id",
          editId
        );

    }


    const {
      data,
      error
    } =
      await query;


    if (
      error
    ) {

      throw error;

    }


    return (
      data &&
      data.length > 0
    );

  }

                )
                .value,

            languages:
              document
                .getElementById(
                  "languages"
                )
                .value
                .trim(),

            services_zh:
              document
                .getElementById(
                  "servicesZh"
                )
                .value
                .trim(),

            services_th:
              document
                .getElementById(
                  "servicesTh"
                )
                .value
                .trim(),

            service_type:
              "party",

            price_per_hour:
              Number(
                document
                  .getElementById(
                    "pricePerHour"
                  )
                  .value
              ),

            minimum_hours:
              Number(
                document
                  .getElementById(
                    "minimumHours"
                  )
                  .value
              ),

            available_time:
              document
                .getElementById(
                  "availableTime"
                )
                .value
                .trim(),

            status:
              document
                .getElementById(
                  "status"
                )
                .value,

            description_zh:
              document
                .getElementById(
                  "descriptionZh"
                )
                .value
                .trim(),

            description_th:
              document
                .getElementById(
                  "descriptionTh"
                )
                .value
                .trim(),

            cover_image:
              imageUrl || null,

            is_published:
              document
                .getElementById(
                  "isPublished"
                )
                .value ===
                "true"

          };


          let companionId =
            editId;


          if (
            editId
          ) {

            const {
              error
            } =
              await supabaseClient
                .from(
                  "companions"
                )
                .update(
                  payload
                )
                .eq(
                  "id",
                  editId
                );


            if (
              error
            ) {

              throw error;

            }

          }
          else {

            const {
              data,
              error
            } =
              await supabaseClient
                .from(
                  "companions"
                )
                .insert(
                  payload
                )
                .select(
                  "id"
                )
                .single();


            if (
              error
            ) {

              throw error;

            }


            companionId =
              data.id;

          }


          mainProfileSaved =
            true;


          /* 删除旧封面 */

          if (
            imageFile &&
            oldCover &&
            oldCover !==
              imageUrl
          ) {

            await removeStorageImage(
              oldCover
            );

          }


          /* 上传多张照片 */

          const galleryFiles =
            Array.from(
              document
                .getElementById(
                  "galleryFiles"
                )
                .files
            );


          if (
            galleryFiles.length > 0
          ) {

            await uploadGalleryFiles(
              galleryFiles,
              companionId,
              slug
            );

          }


          message.className =
            "message success";


          message.textContent =
            currentLanguage === "zh"
              ? "保存成功。"
              : "บันทึกสำเร็จ";


          await loadCompanions();


          setTimeout(
            function() {

              closeModal();

            },
            600
          );

        }
        catch(error) {

          /*
            如果主资料根本没有保存成功，
            才删除刚刚上传的新封面。
          */

          if (
            newCoverUrl &&
            !mainProfileSaved
          ) {

            await removeStorageImage(
              newCoverUrl
            );

          }


          message.className =
            "message error";


          message.textContent =
            error.message;

        }
        finally {

          saveBtn.disabled =
            false;

        }

      }
    );


  /* =========================================
     UPLOAD GALLERY FILES
  ========================================= */

  async function uploadGalleryFiles(
    files,
    companionId,
    slug
  ) {

    let startOrder =
      0;


    const {
      data: existing,
      error: existingError
    } =
      await supabaseClient
        .from(
          "companion_images"
        )
        .select(
          "sort_order"
        )
        .eq(
          "companion_id",
          companionId
        )
        .order(
          "sort_order",
          {
            ascending: false
          }
        )
        .limit(1);


    if (
      existingError
    ) {

      throw existingError;

    }


    if (
      existing &&
      existing.length
    ) {

      startOrder =
        Number(
          existing[0]
            .sort_order
        ) + 1;

    }


    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      let uploaded =
        null;


      try {

        uploaded =
          await uploadStorageImage(
            files[i],
            slug + "/gallery",
            "gallery"
          );


        const {
          error
        } =
          await supabaseClient
            .from(
              "companion_images"
            )
            .insert({

              companion_id:
                companionId,

              image_url:
                uploaded.url,

              sort_order:
                startOrder + i

            });


        if (
          error
        ) {

          throw error;

        }

      }
      catch(error) {

        if (
          uploaded &&
          uploaded.url
        ) {

          await removeStorageImage(
            uploaded.url
          );

        }


        throw error;

      }

    }

  }


  /* =========================================
     LOAD GALLERY
  ========================================= */

  async function loadCompanionGallery(
    companionId
  ) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from(
          "companion_images"
        )
        .select("*")
        .eq(
          "companion_id",
          companionId
        )
        .order(
          "sort_order",
          {
            ascending: true
          }
        );


    if (
      error
    ) {

      alert(
        error.message
      );

      return;

    }


    galleryImages =
      data || [];


    renderGallery();

  }


  /* =========================================
     RENDER GALLERY
  ========================================= */

  function renderGallery() {

    const section =
      document
        .getElementById(
          "existingGallerySection"
        );


    const grid =
      document
        .getElementById(
          "galleryGrid"
        );


    grid.innerHTML =
      "";


    if (
      galleryImages.length === 0
    ) {

      section.style.display =
        "none";


      return;

    }


    section.style.display =
      "block";


    galleryImages.forEach(
      function(image) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "gallery-item";


        div.innerHTML = `

          <img
            src="${escapeHtml(image.image_url)}"
            alt="Party Girl">

          <button
            type="button"
            class="gallery-delete"
            onclick="deleteGalleryImage('${image.id}')">
            ×
          </button>

        `;


        grid.appendChild(
          div
        );

      }
    );

  }


  /* =========================================
     DELETE SINGLE GALLERY IMAGE
  ========================================= */

  async function deleteGalleryImage(
    imageId
  ) {

    const image =
      galleryImages.find(
        item =>
          item.id ===
          imageId
      );


    if (!image) {
      return;
    }


    const ok =
      confirm(
        currentLanguage === "zh"
          ? "确定删除这张照片吗？"
          : "ยืนยันลบรูปนี้หรือไม่?"
      );


    if (!ok) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from(
          "companion_images"
        )
        .delete()
        .eq(
          "id",
          imageId
        );


    if (
      error
    ) {

      alert(
        error.message
      );

      return;

    }


    await removeStorageImage(
      image.image_url
    );


    galleryImages =
      galleryImages.filter(
        item =>
          item.id !==
          imageId
      );


    renderGallery();


    await loadCompanions();

  }


  /* =========================================
     PUBLISH
  ========================================= */

  async function togglePublished(
    id,
    value
  ) {

    const {
      error
    } =
      await supabaseClient
        .from(
          "companions"
        )
        .update({

          is_published:
            value

        })
        .eq(
          "id",
          id
        );


    if (
      error
    ) {

      alert(
        error.message
      );

      return;

    }


    await loadCompanions();

  }


  /* =========================================
     DELETE COMPANION
  ========================================= */

  async function deleteCompanion(
    id
  ) {

    const item =
      companions.find(
        x =>
          x.id === id
      );


    if (!item) {
      return;
    }


    const confirmText =
      currentLanguage === "zh"
        ? `确定删除 ${item.nickname || ""} 吗？人物资料、封面和全部照片都会一起删除。`
        : `ยืนยันลบ ${item.nickname || ""} และรูปภาพทั้งหมดหรือไม่?`;


    if (
      !confirm(
        confirmText
      )
    ) {

      return;

    }


    /*
      先读取全部多图 URL
    */

    const {
      data: images,
      error: imageReadError
    } =
      await supabaseClient
        .from(
          "companion_images"
        )
        .select(
          "image_url"
        )
        .eq(
          "companion_id",
          id
        );


    if (
      imageReadError
    ) {

      alert(
        imageReadError.message
      );

      return;

    }


    /*
      删除 companion_images 数据
    */

    const {
      error: galleryDeleteError
    } =
      await supabaseClient
        .from(
          "companion_images"
        )
        .delete()
        .eq(
          "companion_id",
          id
        );


    if (
      galleryDeleteError
    ) {

      alert(
        galleryDeleteError.message
      );

      return;

    }


    /*
      删除 companions 主资料
    */

    const {
      error
    } =
      await supabaseClient
        .from(
          "companions"
        )
        .delete()
        .eq(
          "id",
          id
        );


    if (
      error
    ) {

      alert(
        error.message
      );

      return;

    }


    /*
      删除封面 Storage
    */

    if (
      item.cover_image
    ) {

      await removeStorageImage(
        item.cover_image
      );

    }


    /*
      删除多图 Storage
    */

    for (
      const image
      of (images || [])
    ) {

      await removeStorageImage(
        image.image_url
      );

    }


    await loadCompanions();

  }


  /* =========================================
     ESCAPE
  ========================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =========================================
     START
  ========================================= */

  async function start() {

    const allowed =
      await protectPage();


    if (!allowed) {
      return;
    }


    setLanguage(
      currentLanguage
    );


    await loadCompanions();

  }


  start();

</script>
